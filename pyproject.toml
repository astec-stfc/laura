[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "laura-accelerator"
description = "A standardized lattice format for particle accelerators"
readme = "README.md"
dynamic = ["version"]
authors = [
    {name = "James Jones", email = "james.jones@stfc.ac.uk"},
]
maintainers = [
    {name = "James Jones", email = "james.jones@stfc.ac.uk"},
    {name = "Alex Brynes", email = "alexander.brynes@stfc.ac.uk"},
    {name = "Mark Johnson", email = "mark.johnson@stfc.ac.uk"},
    {name = "Matt King", email = "matthew.king@stfc.ac.uk"},
]

dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.15",
    "munch>=4",
    "pydantic-core>=2.41.5",
]

requires-python = ">= 3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[tool.setuptools_scm]
version_scheme = "post-release"   # valid built-in scheme
local_scheme = "no-local-version" # removes +untagged suffix


[project.optional-dependencies]

# Individual simulation-code extras
xsuite = [
    "xsuite>=0.40.0",
]

ocelot = [
    "ocelot-desy>=25.06.0",
]

cheetah = [
    "cheetah-accelerator>=0.7.5",
]

wake_t = [
    "wake_t>=0.8.0",
]

bmad = [
    "pytao>=0.5.5",
]

# RF-Track (laura.translator.conversion_rules.codes.rftrack_conversion) is not
# distributed on PyPI, so it has no extras entry here — install the wheel
# manually from the RF-Track page (CERN, A. Latina) into this environment.

# All lattice-conversion backends in one go
# Install with: pip install "laura-accelerator[conversion]"
conversion = [
    "xsuite>=0.40.0",
    "ocelot-desy>=25.06.0",
    "cheetah-accelerator>=0.7.5",
    "wake_t>=0.8.0",
    "pytao>=0.5.5",
]

test = [
    "pytest",
    "pytest-cov",
    # The suite guards these with pytest.importorskip, so they are not hard
    # requirements -- but without them ~35 tests silently skip, which is worse
    # than useless in CI.
    "rdflib>=7.0",
    "sqlalchemy>=2.0",
    "jsonschema>=4.0",
]

docs = [
    "sphinx>=8",
    "sphinx-rtd-theme",
    "myst-nb",
    "sphinx_autodoc_typehints>=3",
    "sphinxcontrib-bibtex",
]

# LinkML schema tooling — generates JSON Schema, OWL, SHACL, docs, etc.
# Install with: pip install "laura-accelerator[schema]"
schema = [
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "jsonschema>=4.0",
]

# RDF / Linked-Data export support
# Install with: pip install "laura-accelerator[rdf]"
rdf = [
    "rdflib>=7.0",
]

# SQL export support (laura.Exporters.SQL + laura/schema/generated/laura_orm.py)
# Install with: pip install "laura-accelerator[sql]"
sql = [
    "sqlalchemy>=2.0",
]

# Everything — conversion backends, docs, schema tooling, and RDF support
# Install with: pip install "laura-accelerator[full]"
full = [
    "xsuite>=0.40.0",
    "ocelot-desy>=25.06.0",
    "cheetah-accelerator>=0.7.5",
    "wake_t>=0.8.0",
    "pytao>=0.5.5",
    "sphinx>=8",
    "sphinx-rtd-theme",
    "myst-nb",
    "sphinx_autodoc_typehints>=3",
    "sphinxcontrib-bibtex",
    "linkml>=1.8",
    "linkml-runtime>=1.8",
    "jsonschema>=4.0",
    "rdflib>=7.0",
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/astec-stfc/laura"
Repository = "https://github.com/astec-stfc/laura.git"
Issues = "https://github.com/astec-stfc/laura/-/issues/"

[tool.setuptools.package-data]
"laura.schema.generated" = ["*.owl", "*.graphql", "*.json", "*.ttl", "*.ts", "*.sql"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: slow tests excluded by default (run with -m slow or --no-header -o addopts='')",
]
filterwarnings = [
    "ignore:Pydantic serializer warnings:UserWarning",
]
