name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Naming-convention gate for the PEP 8 cleanup. The baseline in
  # .ruff-naming-baseline.txt is the count of violations still to be fixed; the
  # job fails if that number goes UP, so the cleanup can land incrementally
  # without new violations sneaking in behind it. Lower the baseline in the
  # same commit that fixes violations. When it reaches 0, replace this whole
  # step with a plain `ruff check laura/`.
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Check naming violations against baseline
        run: |
          baseline=$(tr -dc '0-9' < .ruff-naming-baseline.txt)
          current=$(ruff check laura/ --output-format concise | grep -c '^laura/' || true)
          echo "baseline=$baseline current=$current"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::Naming violations rose from $baseline to $current."
            ruff check laura/ --output-format concise
            exit 1
          fi
          if [ "$current" -lt "$baseline" ]; then
            echo "::notice::Violations fell to $current -- lower the baseline file."
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs history to derive a version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The conversion backends (xsuite, ocelot, ...) are deliberately not
      # installed: no test imports them at module level, so this keeps CI to
      # ~1 minute. Install .[conversion] here if that ever stops being true.
      - name: Install
        run: pip install -e ".[test]"

      - name: Run tests
        run: pytest unit_tests -v

  # laura is consumed by astec-stfc/simba, which imports laura internals
  # directly (Modules/Fields re-exports laura.translator.utils.fields, and
  # Codes/RFTrack imports laura.translator.conversion_rules). Those imports are
  # not covered by laura's own suite, so a rename here shows up as a red simba
  # build days later. This job moves that discovery to the laura PR.
  downstream-simba:
    runs-on: ubuntu-latest
    steps:
      - name: Check out laura (this PR)
        uses: actions/checkout@v4
        with:
          path: laura
          fetch-depth: 0

      - name: Check out simba (main)
        uses: actions/checkout@v4
        with:
          repository: astec-stfc/simba
          ref: main
          path: simba
          fetch-depth: 0
          # Only needed if simba is private; drop otherwise.
          # token: ${{ secrets.SIMBA_CHECKOUT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # Order matters: install simba first so it pulls its pinned laura from
      # PyPI, then overwrite it with this PR's laura. Installing laura first
      # lets simba's own dependency resolution silently replace it.
      - name: Install simba, then this PR's laura over the top
        run: |
          pip install -e "./simba[test]"
          pip install -e "./laura"

      - name: Show which laura is actually in use
        run: python -c "import laura; print(laura.__file__)"

      - name: Run simba's test suite
        run: pytest simba/unit_tests -v
