name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff==0.16.2"

      - name: Check naming
        run: ruff check laura/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs history to derive a version

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[full,test]"

      - name: Run tests
        run: pytest unit_tests -v

  downstream-simba:
    runs-on: ubuntu-latest
    steps:
      - name: Check out laura (this PR)
        uses: actions/checkout@v4
        with:
          path: laura
          fetch-depth: 0

      - name: Check out simba (main)
        uses: actions/checkout@v4
        with:
          repository: astec-stfc/simba
          ref: main
          path: simba
          fetch-depth: 0
          # Only needed if simba is private; drop otherwise.
          # token: ${{ secrets.SIMBA_CHECKOUT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install simba, then this PR's laura over the top
        run: |
          pip install -e "./simba[test,simcodes]"
          pip install -e "./laura"

      - name: Show which laura is actually in use
        run: python -c "import laura; print(laura.__file__)"

      # No simcodes docker image is pulled here, so skip the tests that need it
      # -- same split simba's own workflow uses.
      - name: Run simba's test suite
        run: pytest simba/unit_tests -v -m "not needs_container"
