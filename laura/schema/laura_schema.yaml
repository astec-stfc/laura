id: https://w3id.org/laura/schema
name: laura_schema
title: LAURA Accelerator Element Schema
description: >-
  Linked Data schema for the LAURA (Lattice And Unified Representation of
  Accelerators) accelerator element model.  Covers all element types,
  their physical, magnetic, diagnostic, RF, and control-system properties.
version: "0.1.0"
license: Apache Software License 2.0

prefixes:
  linkml:  https://w3id.org/linkml/
  laura:   https://w3id.org/laura/
  qudt:    http://qudt.org/schema/qudt/
  unit:    http://qudt.org/vocab/unit/
  schema:  http://schema.org/
  skos:    http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  obo:     http://purl.obolibrary.org/obo/
  xsd:     http://www.w3.org/2001/XMLSchema#

default_prefix: laura
default_range: string

imports:
  - linkml:types

subsets:

  physical_properties:
    description: Slots relevant to the physical placement or geometry of an element.

  magnetic_properties:
    description: Slots specific to magnetic elements.

  rf_properties:
    description: Slots specific to RF cavity elements.

  diagnostic_properties:
    description: Slots specific to beam-diagnostic instruments.

  laser_properties:
    description: Slots specific to laser-related elements.

# --- Enumerations -------------------------------------------------------------

enums:

  HardwareClassEnum:
    description: >-
      High-level category organising elements by function within the
      accelerator.  Corresponds to the YAML ``hardware_class`` field.
    permissible_values:
      Magnet:
        description: Magnetic focusing or bending element.
      Diagnostic:
        description: Beam-diagnostic instrument.
      RF:
        description: Radio-frequency accelerating or deflecting structure.
      Vacuum:
        description: Vacuum instrumentation (gauges, valves).
      Laser:
        description: Laser optical element or complete laser system.
      Plasma:
        description: Plasma-based accelerating stage.
      Feedback:
        description: Control-system feedback element.
      Marker:
        description: Virtual survey marker with no physical aperture.
      Aperture:
        description: Mechanical aperture or collimator.
      Stage:
        description: Motorised positioning stage.
      Lighting:
        description: Experimental-hall lighting element.
      Shutter:
        description: Beam or laser shutter.
      Wakefield:
        description: Passive wakefield structure.
      TwissMatch:
        description: Virtual Twiss-parameter matching point.
      Drift:
        description: Drift element.
      Generic:
        description: Generic element.
      Monitor:
        description: Beam monitor element.

  LaserPolarizationEnum:
    description: Polarization state of a laser beam.
    permissible_values:
      linear:     {}
      circular:   {}
      elliptical: {}

  LaserProfileTypeEnum:
    description: Transverse intensity profile model for a laser beam.
    permissible_values:
      gaussian:           {}
      laguerre-gaussian:  {}
      flattened-gaussian: {}
      file:               {}

  ApertureShapeEnum:
    description: Cross-sectional shape of a beam-pipe aperture.
    permissible_values:
      circular:    {}
      rectangular: {}
      elliptical:  {}

# --- Reusable Slots ----------------------------------------------------------

slots:

  # RF cavity / wakefield shared geometry
  cell_length:
    range: float
    description: Length of a single cell [m].
    ifabsent: float(0.03333333333333333)
    minimum_value: 0.0
    unit:
      ucum_code: m

  coupling_cell_length:
    range: float
    description: Length of the coupling cell [m].
    ifabsent: float(0.0)
    minimum_value: 0.0
    unit:
      ucum_code: m

  n_cells:
    range: integer
    description: Number of cells.
    ifabsent: int(1)
    minimum_value: 1

  design_gamma:
    range: float
    description: Design Lorentz factor.
    minimum_value: 1.0

  design_power:
    range: float
    description: Design peak power [W].
    ifabsent: float(25000000)
    minimum_value: 0.0
    unit:
      ucum_code: W

  frequency:
    range: float
    description: Operating frequency [Hz].
    ifabsent: float(2998500000.0)
    minimum_value: 0.0
    unit:
      ucum_code: Hz

  crest:
    range: float
    description: On-crest phase offset providing maximum energy gain [deg].
    ifabsent: float(0)
    unit:
      ucum_code: deg

  phase:
    range: float
    description: Operating phase offset [deg].
    ifabsent: float(0.0)
    unit:
      ucum_code: deg

  shunt_impedance:
    range: float
    description: Shunt impedance [M?/m].

  mode_numerator:
    range: integer
    description: Mode fraction numerator.

  mode_denominator:
    range: integer
    description: Mode fraction denominator.

  # Shared wake-file column labels
  t_column:
    range: string
    description: Time column in the wake file.

  z_column:
    range: string
    description: Longitudinal position column in the wake file.

  wx_column:
    range: string
    description: Horizontal wake column in the wake file.

  wy_column:
    range: string
    description: Vertical wake column in the wake file.

  wz_column:
    range: string
    description: Longitudinal wake column in the wake file.

  # Shared simulation numeric controls
  n_kicks:
    range: integer
    description: Number of integration kicks.

  lsc_bins:
    range: integer
    description: Number of bins used in longitudinal space-charge calculations.

  field_amplitude:
    range: float
    description: Field amplitude scaling.

# --- Classes ------------------------------------------------------------------

classes:

  # -- Position & Rotation ----------------------------------------------------

  Position:
    description: >-
      Cartesian position in the global accelerator coordinate system.
      All components are in metres.
    class_uri: laura:Position
    in_subset:
      - physical_properties
    attributes:
      x:
        range: float
        ifabsent: float(0)
        description: Horizontal component [m].
        unit:
          ucum_code: m
      y:
        range: float
        ifabsent: float(0)
        description: Vertical component [m].
        unit:
          ucum_code: m
      z:
        range: float
        ifabsent: float(0)
        description: Longitudinal (beam-direction) component [m].
        unit:
          ucum_code: m

  Rotation:
    description: >-
      Euler-angle rotation relative to the global coordinate system.
      All angles are in radians, bounded to [-pi, pi].
    class_uri: laura:Rotation
    in_subset:
      - physical_properties
    attributes:
      phi:
        range: float
        ifabsent: float(0)
        description: Rotation about the horizontal (x) axis [rad].
        minimum_value: -3.141592653589793
        maximum_value:  3.141592653589793
        unit:
          ucum_code: rad
      psi:
        range: float
        ifabsent: float(0)
        description: Rotation about the vertical (y) axis [rad].
        minimum_value: -3.141592653589793
        maximum_value:  3.141592653589793
        unit:
          ucum_code: rad
      theta:
        range: float
        ifabsent: float(0)
        description: Rotation about the longitudinal (z) axis [rad].
        minimum_value: -3.141592653589793
        maximum_value:  3.141592653589793
        unit:
          ucum_code: rad

  # -- Physical placement -----------------------------------------------------

  ElementPositionError:
    description: Alignment position and rotation errors for a physically-located element.
    class_uri: laura:ElementPositionError
    attributes:
      position:
        range: Position
        description: Positional misalignment error [m].
      rotation:
        range: Rotation
        description: Angular misalignment error [rad].

  ElementSurvey:
    description: >-
      Survey-measured position and rotation of an element.
      Structure is identical to ElementPositionError.
    class_uri: laura:ElementSurvey
    attributes:
      position:
        range: Position
        description: Surveyed position.
      rotation:
        range: Rotation
        description: Surveyed rotation.

  PhysicalElement:
    description: >-
      Physical placement data: position, rotation, length, and associated
      survey / alignment-error information.
    class_uri: laura:PhysicalElement
    in_subset:
      - physical_properties
    attributes:
      middle:
        range: Position
        description: >-
          Longitudinal midpoint (centre) of the element.
          Also accepted as ``position`` or ``centre`` in YAML.
        aliases:
          - position
          - centre
      datum:
        range: Position
        description: Datum reference position.
      rotation:
        range: Rotation
        description: Local rotation in the global frame.
      global_rotation:
        range: Rotation
        description: Accumulated global rotation including parent-frame contributions.
      error:
        range: ElementPositionError
        description: Alignment errors.
      survey:
        range: ElementSurvey
        description: Survey-measured position and rotation.
      length:
        range: float
        ifabsent: float(0)
        description: Effective length along the beam axis [m].
        minimum_value: 0.0
        unit:
          ucum_code: m
      maximum_position:
        range: float
        description: Maximum downstream s-coordinate [m].
        unit:
          ucum_code: m
      minimum_position:
        range: float
        description: Minimum upstream s-coordinate [m].
        unit:
          ucum_code: m
      physical_angle:
        range: float
        ifabsent: float(0)
        description: >-
          Bending angle in the horizontal plane [rad].
          Derived from ``magnetic.angle`` when available.
        unit:
          ucum_code: rad

  # -- Electrical -------------------------------------------------------------

  ElectricalElement:
    description: Power-supply electrical limits for a beamline element.
    class_uri: laura:ElectricalElement
    attributes:
      min_i:
        range: float
        ifabsent: float(0)
        description: Minimum current [A].
        aliases:
          - minI
        unit:
          ucum_code: A
      max_i:
        range: float
        ifabsent: float(0)
        description: Maximum current [A].
        aliases:
          - maxI
        unit:
          ucum_code: A
      read_tolerance:
        range: float
        ifabsent: float(0.1)
        description: >-
          Read-back vs. set-point tolerance fraction (default 0.1 = 10 %).
        aliases:
          - ri_tolerance

  # -- Manufacturer ----------------------------------------------------------

  ManufacturerElement:
    description: Manufacturer and serial-number metadata.
    class_uri: laura:ManufacturerElement
    attributes:
      manufacturer:
        range: string
        ifabsent: string()
        description: Name of the manufacturer.
        slot_uri: schema:manufacturer
      serial_number:
        range: string
        ifabsent: string()
        description: Manufacturer serial number.
        slot_uri: schema:serialNumber

  # -- Reference documents ----------------------------------------------------

  ReferenceElement:
    description: Links to engineering drawings and design files.
    class_uri: laura:ReferenceElement
    attributes:
      drawings:
        multivalued: true
        range: string
        description: Engineering-drawing identifiers or URIs.
      design_files:
        multivalued: true
        range: string
        description: Design-file paths or URIs.

  # -- Control system ---------------------------------------------------------

  ControlVariable:
    description: >-
      A single process-variable entry mapping a logical name to a
      control-system PV identifier.
    class_uri: laura:ControlVariable
    attributes:
      identifier:
        range: string
        description: Protocol-specific PV name (e.g., EPICS PV address).
      dtype:
        range: string
        description: Data type (e.g., ``float``, ``int``).
      protocol:
        range: string
        description: Control-system protocol (e.g., ``EPICS``, ``Tango``).
      units:
        range: string
        description: Physical units string (e.g., ``A``, ``T/m``).
      description:
        range: string
        description: Human-readable description.
      read_only:
        range: boolean
        description: Whether the variable is read-only.
      value:
        range: float
        description: Last-read value.
      target:
        range: float
        description: Set-point target value.
      expression:
        range: string
        description: Optional expression string for derived values.

  ControlsInformation:
    description: >-
      Collection of process-variable definitions for an element's control
      interface.
    class_uri: laura:ControlsInformation
    attributes:
      variables:
        multivalued: true
        range: ControlVariable
        description: Named control variables keyed by logical name.

  # -- Simulation -------------------------------------------------------------

  SimulationElement:
    description: >-
      Base simulation attributes: field-map files and reference positions
      for tracking codes.
    class_uri: laura:SimulationElement
    attributes:
      field_definition:
        range: string
        description: Path to the 3-D field-map file.
      wakefield_definition:
        range: string
        description: Path to the wakefield impedance file.
      field_reference_position:
        range: string
        description: Longitudinal origin of the field map [m].
      scale_field:
        range: float
        description: Multiplicative scale factor applied to the field map.
        ifabsent: float(1)

  MagnetSimulationElement:
    is_a: SimulationElement
    description: >-
      Simulation attributes specific to magnets: integrator settings,
      fringe-field model, and radiation flags.
    class_uri: laura:MagnetSimulationElement
    slots:
      - n_kicks
      - field_amplitude
    slot_usage:
      n_kicks:
        description: Number of integration kicks.
        ifabsent: int(4)
        minimum_value: 1
      field_amplitude:
        description: Field amplitude scaling for magnet tracking.
        ifabsent: float(0.0)
    attributes:
      n_slices:
        range: integer
        description: Number of longitudinal slices for thick-lens tracking.
        ifabsent: int(4)
        minimum_value: 1
      smooth:
        range: boolean
        description: Use a smoothed field profile.
      edge_field_integral:
        range: float
        description: Fringe-field integral for edge focussing.
        ifabsent: float(0.5)
      edge1_effects:
        range: boolean
        description: Enable entrance-edge focussing effects.
      edge2_effects:
        range: boolean
        description: Enable exit-edge focussing effects.
      sr_enable:
        range: boolean
        description: Enable synchrotron-radiation energy loss.
        ifabsent: true
      isr_enable:
        range: boolean
        description: Enable incoherent synchrotron-radiation emittance growth.
        ifabsent: true
      csr_enable:
        range: boolean
        description: Enable coherent synchrotron radiation.
        ifabsent: true
      csr_bins:
        range: integer
        description: Number of longitudinal bins for the CSR mesh.
        ifabsent: int(100)
      integration_order:
        range: integer
        description: Order of the symplectic integrator.
        ifabsent: int(4)
      nonlinear:
        range: boolean
        description: Include higher-order (sextupole+) field components.
      smoothing_half_width:
        range: integer
        description: Half-width of the current-profile smoothing kernel.
        ifabsent: int(1)
      edge_order:
        range: integer
        description: Polynomial order of the edge-field expansion.
        ifabsent: int(2)
      deltaL:
        range: float
        description: Longitudinal step-size override for thick-lens integration [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      smooth_points:
        range: float
        description: Number of points used to smooth the field map [ASTRA].
        ifabsent: float(2)

  RFCavitySimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for RF cavity elements.
    class_uri: laura:RFCavitySimulationElement
    slots:
      - t_column
      - z_column
      - wx_column
      - wy_column
      - wz_column
      - n_kicks
      - lsc_bins
      - field_amplitude
    slot_usage:
      n_kicks:
        description: Number of cavity kicks to apply.
        ifabsent: int(0)
      lsc_bins:
        description: Number of longitudinal space-charge bins.
        ifabsent: int(100)
      field_amplitude:
        description: Cavity field amplitude.
        ifabsent: float(0)
    attributes:
      change_p0:
        range: integer
        description: Flag indicating whether the cavity changes reference momentum.
        ifabsent: int(1)
      end1_focus:
        range: integer
        description: Apply entrance focusing.
        ifabsent: int(1)
      end2_focus:
        range: integer
        description: Apply exit focusing.
        ifabsent: int(1)
      body_focus_model:
        range: string
        description: Cavity body focusing model.
        ifabsent: string(SRS)
      current_bins:
        range: integer
        description: Number of current bins.
        ifabsent: int(0)
      interpolate_current_bins:
        range: integer
        description: Flag indicating current-bin interpolation.
        ifabsent: int(1)
      smooth_current_bins:
        range: integer
        description: Flag indicating current-bin smoothing.
        ifabsent: int(1)
      smooth:
        range: integer
        description: Cavity smoothing parameter.
      ez_peak:
        range: float
        description: Peak longitudinal electric field.
      field_file_name:
        range: string
        description: Cavity field file name.
      wakefile:
        range: string
        description: Wake file name.
      zwakefile:
        range: string
        description: Longitudinal wake file name.
      trwakefile:
        range: string
        description: Transverse wake file name.

  WakefieldSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for passive wakefield structures.
    class_uri: laura:WakefieldSimulationElement
    slots:
      - t_column
      - z_column
      - wx_column
      - wy_column
      - wz_column
    attributes:
      allow_long_beam:
        range: boolean
        description: Allow beams longer than the wakefield.
        ifabsent: true
      bunched_beam:
        range: boolean
        description: Use bunched beam mode.
        ifabsent: false
      change_momentum:
        range: boolean
        description: Allow wakefield to change bunch momentum.
        ifabsent: true
      factor:
        range: float
        description: Wake scaling factor.
        ifabsent: float(1)
      interpolate:
        range: boolean
        description: Interpolate points in wake file.
        ifabsent: true
      scale_kick:
        range: float
        description: Factor by which to scale wake kicks.
        ifabsent: float(1)
      scale_field_ex:
        range: float
        description: x-component of the longitudinal direction vector.
        ifabsent: float(0.0)
      scale_field_ey:
        range: float
        description: y-component of the longitudinal direction vector.
        ifabsent: float(0.0)
      scale_field_ez:
        range: float
        description: z-component of the longitudinal direction vector.
        ifabsent: float(1.0)
      scale_field_hx:
        range: float
        description: x-component of the horizontal direction vector.
        ifabsent: float(1.0)
      scale_field_hy:
        range: float
        description: y-component of the horizontal direction vector.
        ifabsent: float(0.0)
      scale_field_hz:
        range: float
        description: z-component of the horizontal direction vector.
        ifabsent: float(0.0)
      equal_grid:
        range: float
        description: Interpolation between equidistant and equal-charge grids.
        ifabsent: float(0.66)
      interpolation_method:
        range: integer
        description: Interpolation method for ASTRA.
        ifabsent: int(2)
      smooth:
        range: float
        description: Smoothing parameter for Gaussian interpolation.
        ifabsent: float(0.25)
      subbins:
        range: integer
        description: Sub-binning parameter.
        ifabsent: int(10)

  DriftSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for field-free drift sections.
    class_uri: laura:DriftSimulationElement
    slots:
      - lsc_bins
    slot_usage:
      lsc_bins:
        description: Number of bins for LSC calculations.
        ifabsent: int(20)
    attributes:
      lsc_interpolate:
        range: integer
        description: Flag to allow interpolation of computed LSC wake.
        ifabsent: int(1)
      csr_enable:
        range: boolean
        description: Enable CSR drift calculations.
        ifabsent: true
      lsc_enable:
        range: boolean
        description: Enable LSC drift calculations.
        ifabsent: true
      use_stupakov:
        range: integer
        description: Use Stupakov formula.
        ifabsent: int(1)
      csrdz:
        range: float
        description: Step size for CSR calculations.
        ifabsent: float(0.01)
      lsc_high_frequency_cutoff_start:
        range: float
        description: High-frequency cutoff start for LSC.
      lsc_high_frequency_cutoff_end:
        range: float
        description: High-frequency cutoff end for LSC.
      lsc_low_frequency_cutoff_start:
        range: float
        description: Low-frequency cutoff start for LSC.
      lsc_low_frequency_cutoff_end:
        range: float
        description: Low-frequency cutoff end for LSC.

  DiagnosticSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for beam-diagnostic elements.
    class_uri: laura:DiagnosticSimulationElement
    attributes:
      output_filename:
        range: string
        description: Output filename for diagnostic data.

  PlasmaSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for plasma-accelerator stages.
    class_uri: laura:PlasmaSimulationElement
    attributes:
      wakefield_model:
        range: string
        description: Wakefield model identifier.
      bunch_pusher:
        range: string
        description: Pusher used to evolve bunch particles in time.
        ifabsent: string(boris)
      dt_bunch:
        range: string
        description: Time-step control for bunch evolution (or 'auto').
        ifabsent: string(auto)
      n_out:
        range: integer
        description: Number of distribution dumps during the plasma stage.
        ifabsent: int(1)
      min_longitudinal_position:
        range: float
        description: Minimum longitudinal position [m].
        ifabsent: float(0)
      max_longitudinal_position:
        range: float
        description: Maximum longitudinal position [m].
        ifabsent: float(0)
      n_longitudinal:
        range: integer
        description: Number of grid points in the longitudinal direction.
        ifabsent: int(0)
      n_radial:
        range: integer
        description: Number of grid points in the radial direction.
        ifabsent: int(0)
      plasma_particles_per_cell:
        range: integer
        description: Number of plasma particles per cell.
        ifabsent: int(2)
      r_max:
        range: float
        description: Radial extent of the simulation box [m].
        ifabsent: float(0)
      r_max_plasma:
        range: float
        description: Maximum radial extension of the plasma column.
      dz_fields:
        range: float
        description: Interval for plasma wakefield updates.
      plasma_pusher:
        range: string
        description: Pusher used to evolve the plasma in time.
        ifabsent: string(boris)

  TwissMatchSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for Twiss-matching points.
    class_uri: laura:TwissMatchSimulationElement
    attributes:
      beta_x:
        range: float
        description: Horizontal beta.
      beta_y:
        range: float
        description: Vertical beta.
      alpha_x:
        range: float
        description: Horizontal alpha.
      alpha_y:
        range: float
        description: Vertical alpha.
      eta_x:
        range: float
        description: Horizontal dispersion.
        ifabsent: float(0.0)
      eta_y:
        range: float
        description: Vertical dispersion.
        ifabsent: float(0.0)
      eta_xp:
        range: float
        description: Horizontal dispersion derivative.
        ifabsent: float(0.0)
      eta_yp:
        range: float
        description: Vertical dispersion derivative.
        ifabsent: float(0.0)
      from_beam:
        range: boolean
        description: Compute transform from tracked beam properties.
        ifabsent: true

  # -- Magnetic model ---------------------------------------------------------

  Multipole:
    description: >-
      Individual multipole field component, characterised by order and
      integrated normal / skew strengths at a reference radius.
    class_uri: laura:Multipole
    attributes:
      order:
        range: integer
        description: "Multipole order (0 = dipole, 1 = quadrupole, ?)."
        ifabsent: int(0)
        minimum_value: 0
      normal:
        range: float
        description: "Integrated normal (upright) multipole strength [T.m^{1-n}]."
        ifabsent: float(0)
      skew:
        range: float
        description: "Integrated skew (rotated) multipole strength [T.m^{1-n}]."
        ifabsent: float(0)
      radius:
        range: float
        description: Reference radius for multipole normalisation [m].
        ifabsent: float(0)
        unit:
          ucum_code: m

  Multipoles:
    description: >-
      Complete set of integrated multipole strengths up to decapole order,
      as named slots for efficient element look-up.
    class_uri: laura:MultipoleList
    
    attributes:
      K0L:
        range: Multipole
        description: Integrated dipole field.
      K1L:
        range: Multipole
        description: Integrated quadrupole gradient.
      K2L:
        range: Multipole
        description: Integrated sextupole strength.
      K3L:
        range: Multipole
        description: Integrated octupole strength.
      K4L:
        range: Multipole
        description: Integrated decapole strength.

  FieldIntegral:
    description: >-
      Polynomial fit of integrated field strength as a function of magnet
      current.
    class_uri: laura:FieldIntegral
    attributes:
      coefficients:
        multivalued: true
        range: float
        ifabsent: [0]
        description: >-
          Polynomial coefficients ordered from lowest to highest degree:
          ``FieldIntegral = sum c_n . I^n``.

  LinearSaturationFit:
    description: >-
      Bi-linear saturation model mapping magnet current to integrated
      field strength (K-value conversion).
    class_uri: laura:LinearSaturationFit
    attributes:
      m:
        range: float
        description: Linear slope of the unsaturated region.
        ifabsent: float(0)
      I_max:
        range: float
        description: Current at which saturation begins [A].
        ifabsent: float(0)
        unit:
          ucum_code: A
      f:
        range: float
        description: Saturation fraction (slope ratio below/above I_max).
        ifabsent: float(0)
      a:
        range: float
        description: Quadratic saturation coefficient.
        ifabsent: float(0)
      I0:
        range: float
        description: Current offset [A].
        ifabsent: float(0)
        unit:
          ucum_code: A
      d:
        range: float
        description: Constant offset term.
        ifabsent: float(0)
      L:
        range: float
        description: Effective magnetic length [m].
        ifabsent: float(0)
        unit:
          ucum_code: m

  MagneticElement:
    description: >-
      Magnetic field parameters for a beamline magnet, including multipole
      components, field integrals, and geometric edge parameters.
    class_uri: laura:MagneticElement
    in_subset:
      - magnetic_properties
    attributes:
      order:
        range: integer
        ifabsent: int(-1)
        description: "Principal multipole order (0 = dipole, 1 = quad, ?)."
        minimum_value: -1
      skew:
        range: boolean
        ifabsent: false
        description: >-
          Whether the magnet is rotated 45? to produce a skew field
          component.
      magnetic_length:
        alias: length
        range: float
        ifabsent: float(0)
        description: Magnetic (effective) length [m].
        minimum_value: 0.0
        unit:
          ucum_code: m
      multipoles:
        range: Multipoles
        description: Integrated multipole field components.
      systematic_multipoles:
        range: Multipoles
        description: Systematic (design) multipole errors at the reference radius.
      random_multipoles:
        range: Multipoles
        description: Random multipole errors at the reference radius.
      field_integral_coefficients:
        range: FieldIntegral
        description: Polynomial calibration of integrated field vs. current.
      linear_saturation_coefficients:
        range: LinearSaturationFit
        description: Bi-linear saturation calibration.
      settle_time:
        range: float
        description: Power-supply settle time after a change [s].
        unit:
          ucum_code: s
      entrance_edge_angle:
        range: float
        description: Fringe-field entrance edge angle [rad].
        unit:
          ucum_code: rad
      exit_edge_angle:
        range: float
        description: Fringe-field exit edge angle [rad].
        unit:
          ucum_code: rad
      gap:
        range: float
        ifabsent: float(0.032)
        description: Full gap between pole faces [m].
        minimum_value: 0.0
        unit:
          ucum_code: m
      bore:
        range: float
        ifabsent: float(0.037)
        description: Magnet bore radius [m].
        minimum_value: 0.0
        unit:
          ucum_code: m
      plane:
        range: string
        ifabsent: string(horizontal)
        description: "Principal bending / focusing plane (``H``, ``V``, or ``HV``)."
      width:
        range: float
        ifabsent: float(0.2)
        description: Physical width of the magnet in the bending plane [m].
        unit:
          ucum_code: m
      tilt:
        range: float
        ifabsent: float(0.0)
        description: Global tilt about the beam axis [rad].
        unit:
          ucum_code: rad
      edge_field_integral:
        range: float
        ifabsent: float(0.5)
        description: Enge fringe-field integral parameter (dimensionless).
      fringe_field_coefficient:
        ifabsent: float(0.0)
        range: float
        description: Coefficient controlling the fringe-field roll-off rate.
      gradient:
        range: float
        description: Peak field gradient [T/m] (quads) or peak field [T] (dipoles).
        unit:
          ucum_code: T.m-1

  # -- Aperture ---------------------------------------------------------------

  ApertureElement:
    description: Transverse aperture geometry for drift-space checks and collimators.
    class_uri: laura:ApertureElement
    attributes:
      number_of_elements:
        range: integer
        description: Number of aperture sub-elements (e.g., for multi-leaf collimators).
        minimum_value: 1
      horizontal_size:
        range: float
        description: Full horizontal aperture [m].
        ifabsent: float(0.0)
        minimum_value: 0.0
        unit:
          ucum_code: m
      vertical_size:
        range: float
        description: Full vertical aperture [m].
        ifabsent: float(0.0)
        minimum_value: 0.0
        unit:
          ucum_code: m
      shape:
        range: ApertureShapeEnum
        description: Cross-sectional aperture shape.
      radius:
        range: float
        description: Radius for circular apertures [m].
        minimum_value: 0.0
        unit:
          ucum_code: m
      negative_extent:
        range: float
        description: Upstream / inner extent [m].
        unit:
          ucum_code: m
      positive_extent:
        range: float
        description: Downstream / outer extent [m].
        unit:
          ucum_code: m

  # -- RF / Wakefield ---------------------------------------------------------

  RFCavityElement:
    description: RF cavity accelerating-structure parameters.
    class_uri: laura:RFCavityElement
    in_subset:
      - rf_properties
    slots:
      - cell_length
      - coupling_cell_length
      - design_gamma
      - design_power
      - frequency
      - n_cells
      - crest
      - phase
      - shunt_impedance
      - mode_numerator
      - mode_denominator
    attributes:
      structure_type:
        range: string
        description: >-
          RF structure type (e.g., ``SW`` standing-wave, ``TW``
          travelling-wave).
        ifabsent: string(StandingWave)
        aliases:
          - structure_Type
      attenuation_constant:
        range: float
        description: Attenuation constant ? of a travelling-wave structure [Np/m].
        ifabsent: float(0)
      power_calibration:
        range: float
        multivalued: true
        description: Calibration constant relating measured power to cavity gradient.
      gradient_calibration:
        range: float
        multivalued: true
        description: "Calibration relating measured signal to gradient [MV/m per a.u.]."

  WakefieldElement:
    description: Passive wakefield structure parameters.
    class_uri: laura:WakefieldElement
    in_subset:
      - rf_properties
    slots:
      - cell_length
      - n_cells
      - coupling_cell_length

  RFDeflectingCavityElement:
    description: >-
      Transverse-deflecting RF cavity parameters -- a subset of
      RFCavityElement for streak-mode operation.
    class_uri: laura:RFDeflectingCavityElement
    in_subset:
      - rf_properties
    slots:
      - cell_length
      - coupling_cell_length
      - crest
      - design_gamma
      - design_power
      - frequency
      - n_cells
      - phase
      - shunt_impedance
      - mode_numerator
      - mode_denominator

  PIDElement:
    description: PID feedback-controller parameters.
    class_uri: laura:PIDElement
    attributes:
      Kp:
        range: float
        description: Proportional gain.
      Ki:
        range: float
        description: Integral gain.
      Kd:
        range: float
        description: Derivative gain.
      forward_channel:
        range: integer
        description: Forward channel index.
      probe_channel:
        range: integer
        description: Probe channel index.
      enable:
        range: string
        description: Enable command/value.
      disable:
        range: string
        description: Disable command/value.
      phase_range:
        range: PIDPhaseRange
        description: Phase tuning range.
      phase_weight_range:
        range: PIDWeightRange
        description: Phase weighting range.

  PIDPhaseRange:
    description: Numeric min/max range for PID phase control.
    class_uri: laura:PIDPhaseRange
    attributes:
      min:
        range: float
        description: Minimum value.
      max:
        range: float
        description: Maximum value.

  PIDWeightRange:
    is_a: PIDPhaseRange
    description: Numeric min/max range for PID phase weighting.
    class_uri: laura:PIDWeightRange

  Trace:
    description: LLRF trace metadata.
    class_uri: laura:Trace
    attributes:
      data_size:
        range: integer
        description: Number of points in a trace.
        aliases: [trace_data_size]
      data_count:
        range: integer
        description: Number of one-record trace entries.
        aliases: [one_trace_data_count]
      data_chunk_size:
        range: integer
        description: Chunk size for one-record traces.
        aliases: [one_trace_data_chunk_size]
      number_of_start_zeros:
        range: integer
        description: Number of leading zeros in a trace.
        aliases: [trace_num_of_start_zeros]

  ChannelNames:
    description: Names for LLRF channels 1..8.
    class_uri: laura:ChannelNames
    attributes:
      ch1:
        range: string
        ifabsent: string()
        aliases: [CH1]
      ch2:
        range: string
        ifabsent: string()
        aliases: [CH2]
      ch3:
        range: string
        ifabsent: string()
        aliases: [CH3]
      ch4:
        range: string
        ifabsent: string()
        aliases: [CH4]
      ch5:
        range: string
        ifabsent: string()
        aliases: [CH5]
      ch6:
        range: string
        ifabsent: string()
        aliases: [CH6]
      ch7:
        range: string
        ifabsent: string()
        aliases: [CH7]
      ch8:
        range: string
        ifabsent: string()
        aliases: [CH8]

  LLRFTiming:
    description: Start/end window timing definition.
    class_uri: laura:LLRFTiming
    attributes:
      start:
        range: float
        description: Start time.
      end:
        range: float
        description: End time.

  LLRFTimings:
    description: Collection of timing windows for key LLRF channels.
    class_uri: laura:LLRFTimings
    attributes:
      klystron_forward:
        range: LLRFTiming
        description: Timing for klystron forward power.
      klystron_reverse:
        range: LLRFTiming
        description: Timing for klystron reverse power.
      cavity_forward:
        range: LLRFTiming
        description: Timing for cavity forward power.
      cavity_reverse:
        range: LLRFTiming
        description: Timing for cavity reverse power.
      cavity_probe:
        range: LLRFTiming
        description: Timing for cavity probe.

  LowLevelRFElement:
    description: Low-level RF (LLRF) system parameters.
    class_uri: laura:LowLevelRFElement
    attributes:
      trace:
        range: Trace
        description: Trace metadata.
      max_amplitude:
        range: float
        description: Maximum allowed amplitude.
        aliases: [MAX_AMPLITUDE]
      channel_names:
        range: ChannelNames
        description: Channel labels.
      crest_phase:
        range: float
        description: Cavity crest phase.
      timings:
        range: LLRFTimings
        description: Timing windows for LLRF channels.

  RFModulatorElement:
    description: RF modulator (klystron driver) parameters.
    class_uri: laura:RFModulatorElement

  RFProtectionElement:
    description: RF protection system parameters.
    class_uri: laura:RFProtectionElement
    attributes:
      prot_type:
        range: string
        description: Protection system type.

  RFHeartbeatElement:
    description: RF heartbeat / timing-monitor element parameters.
    class_uri: laura:RFHeartbeatElement

  # -- Diagnostic sub-models --------------------------------------------------

  DiagnosticElement:
    description: >-
      Base class for diagnostic instrument sub-models.  Concrete sub-models
      extend this with instrument-specific fields.
    class_uri: laura:DiagnosticElement

  BPMDiagnosticElement:
    is_a: DiagnosticElement
    description: Beam-position monitor (BPM) diagnostic data.
    class_uri: laura:BPMDiagnosticElement
    in_subset:
      - diagnostic_properties
    attributes:
      type:
        range: string
        description: >-
          BPM type (e.g., ``Stripline``, ``Cavity``, ``Button``).
          Accepted in YAML as ``bpm_type``.
        ifabsent: string(Stripline)
        aliases:
          - bpm_type

  BAMDiagnosticElement:
    is_a: DiagnosticElement
    description: Beam-arrival monitor (BAM) diagnostic data.
    class_uri: laura:BAMDiagnosticElement
    in_subset:
      - diagnostic_properties
    attributes:
      type:
        range: string
        description: BAM type. Accepted in YAML as ``bam_type``.
        ifabsent: string(DESY)
        aliases:
          - bam_type

  BLMDiagnosticElement:
    is_a: DiagnosticElement
    description: Bunch-length monitor (BLM) diagnostic data.
    class_uri: laura:BLMDiagnosticElement
    in_subset:
      - diagnostic_properties
    attributes:
      type:
        range: string
        description: "BLM type (e.g., ``CDR``). Accepted in YAML as ``blm_type``."
        ifabsent: string(CDR)
        aliases:
          - blm_type

  ScreenDiagnosticElement:
    is_a: DiagnosticElement
    description: Scintillator or OTR screen diagnostic data.
    class_uri: laura:ScreenDiagnosticElement
    in_subset:
      - diagnostic_properties
    attributes:
      type:
        range: string
        description: Screen type (e.g., ``OTR``, ``YAG``).
        ifabsent: string(CLARA_HV_MOVER)
        aliases:
          - screen_type
      has_camera:
        range: boolean
        description: Whether the screen has an associated camera.
        ifabsent: true
      camera_name:
        range: string
        description: Name of the associated camera element.
        ifabsent: string()
      devices:
        range: string
        multivalued: true
        description: List of attached devices.
        ifabsent: []

  ChargeDiagnosticElement:
    is_a: DiagnosticElement
    description: Charge-measurement diagnostic data (base for ICT, FCM, WCM).
    class_uri: laura:ChargeDiagnosticElement
    in_subset:
      - diagnostic_properties
    attributes:
      type:
        range: string
        description: >-
          Charge-diagnostic type. Accepted in YAML as ``charge_type``.
        aliases:
          - charge_type

  # -- Camera sub-models (components of CameraDiagnosticElement) ---------------

  CameraPixelResultsIndices:
    description: >-
      Indices into camera pixel-analysis result arrays.
    class_uri: laura:CameraPixelResultsIndices
    attributes:
      x:
        range: integer
        description: Beam centroid index in x.
        ifabsent: int(0)
        aliases: [X_POS]
      y:
        range: integer
        description: Beam centroid index in y.
        ifabsent: int(1)
        aliases: [Y_POS]
      x_sigma:
        range: integer
        description: Beam sigma index in x.
        ifabsent: int(2)
        aliases: [X_SIGMA_POS]
      y_sigma:
        range: integer
        description: Beam sigma index in y.
        ifabsent: int(3)
        aliases: [Y_SIGMA_POS]
      covariance:
        range: integer
        description: Beam covariance index.
        ifabsent: int(4)
        aliases: [COV_POS]

  CameraPixelResultsNames:
    description: >-
      Names of camera pixel-analysis result arrays.
    class_uri: laura:CameraPixelResultsNames
    attributes:
      x:
        range: string
        description: Beam centroid name in x.
        ifabsent: string(X)
        aliases: [X_NAME]
      y:
        range: string
        description: Beam centroid name in y.
        ifabsent: string(Y)
        aliases: [Y_NAME]
      x_sigma:
        range: string
        description: Beam sigma name in x.
        ifabsent: string(X_SIGMA)
        aliases: [X_SIGMA_NAME]
      y_sigma:
        range: string
        description: Beam sigma name in y.
        ifabsent: string(Y_SIGMA)
        aliases: [Y_SIGMA_NAME]
      covariance:
        range: string
        description: Beam covariance name.
        ifabsent: string(COV)
        aliases: [COV_NAME]

  CameraMask:
    description: >-
      Camera analysis mask parameters.
    class_uri: laura:CameraMask
    attributes:
      middle:
        range: float
        multivalued: true
        description: Center of the mask in pixels [x, y].
      radius:
        range: float
        multivalued: true
        description: Mask radius in pixels [x, y].
      maximum:
        range: float
        multivalued: true
        description: Maximum mask radius in pixels [x, y].
      use_maximum_values:
        range: boolean
        description: If True, use maximum mask radius constraints.
        ifabsent: true
        aliases: [USE_MASK_RAD_LIMITS]

  CameraSensor:
    description: >-
      Camera sensor hardware configuration.
    class_uri: laura:CameraSensor
    attributes:
      x_pixels:
        range: integer
        description: Raw sensor pixel count in x.
        ifabsent: int(2160)
        aliases: [BINARY_NUM_PIX_X]
      y_pixels:
        range: integer
        description: Raw sensor pixel count in y.
        ifabsent: int(2560)
        aliases: [BINARY_NUM_PIX_Y]
      x_scale_factor:
        range: integer
        description: Pixel binning factor in x.
        ifabsent: int(2)
        aliases: [X_PIX_SCALE_FACTOR]
      y_scale_factor:
        range: integer
        description: Pixel binning factor in y.
        ifabsent: int(2)
        aliases: [Y_PIX_SCALE_FACTOR]
      beam_pixel_average:
        range: float
        description: Average pixel value for beam detection.
        ifabsent: float(97.2)
        aliases: [AVG_PIXEL_VALUE_FOR_BEAM]
      middle:
        range: float
        multivalued: true
        description: Sensor optical center in pixels [x, y].
      x_pixels_to_mm:
        range: float
        description: Pixel-to-mm scale factor in x.
        ifabsent: float(0.0134)
      y_pixels_to_mm:
        range: float
        description: Pixel-to-mm scale factor in y.
        ifabsent: float(0.0134)
      minimum:
        range: float
        multivalued: true
        description: Minimum pixel positions [x, y].
      maximum:
        range: float
        multivalued: true
        description: Maximum pixel positions [x, y].
      bit_depth:
        range: integer
        description: Camera bit depth.
        ifabsent: int(16)
      operating_middle:
        range: float
        multivalued: true
        description: Operating center positions in pixels [x, y].
      mechanical_middle:
        range: float
        multivalued: true
        description: Mechanical center of the camera in pixels [x, y].

  CameraDiagnosticElement:
    is_a: DiagnosticElement
    description: >-
      Camera diagnostic data, including sensor parameters, analysis mask,
      and pixel-to-mm scale factors.
    class_uri: laura:CameraDiagnosticElement
    in_subset:
      - diagnostic_properties
    attributes:
      type:
        range: string
        description: >-
          Camera type / model string (e.g., ``PCO``, ``Manta``).
          Accepted in YAML as ``CAM_TYPE``.
        aliases:
          - CAM_TYPE
      x_pixels:
        range: integer
        description: Image width reported by the control system [pix].
        ifabsent: int(1080)
        aliases:
          - ARRAY_DATA_NUM_PIX_X
          - epics_x_pixels
      y_pixels:
        range: integer
        description: Image height reported by the control system [pix].
        ifabsent: int(1280)
        aliases:
          - ARRAY_DATA_NUM_PIX_Y
          - epics_y_pixels
      rotation:
        range: float
        description: Camera rotation relative to the screen plane [deg].
        ifabsent: float(0)
        unit:
          ucum_code: deg
      flipped_horizontally:
        range: boolean
        description: True if the image is mirrored left-right.
        ifabsent: true
        aliases:
          - IMAGE_FLIP_LR
      flipped_vertically:
        range: boolean
        description: True if the image is mirrored top-bottom.
        ifabsent: false
        aliases:
          - IMAGE_FLIP_UD
      screen_name:
        range: string
        description: Name of the screen element to which this camera is attached.
      has_led:
        range: boolean
        description: True if the camera mount includes an LED backlight.
        ifabsent: true
      pixel_results_indices:
        range: CameraPixelResultsIndices
        description: Indices of pixel analysis result arrays.
      pixel_results_names:
        range: CameraPixelResultsNames
        description: Names of pixel analysis result arrays.
      mask:
        range: CameraMask
        description: Camera analysis mask configuration.
      sensor:
        range: CameraSensor
        description: Camera sensor hardware configuration.

  # -- Laser sub-models -------------------------------------------------------

  LaserElement:
    description: >-
      Laser-beam parameters (wavelength, pulse energy, profile, etc.) for
      a laser element or laser-driven plasma stage.
    class_uri: laura:LaserElement
    in_subset:
      - laser_properties
    attributes:
      initial_position:
        range: float
        description: Initial longitudinal position of the laser pulse [m].
        ifabsent: float(0)
        unit:
          ucum_code: m
      waist:
        range: float
        description: Laser beam waist (1/e^2 radius) [m].
        ifabsent: float(0)
        minimum_value: 0.0
        unit:
          ucum_code: m
      wavelength:
        range: float
        description: Laser wavelength [m].
        minimum_value: 0.0
        unit:
          ucum_code: m
      pulse_energy:
        range: float
        description: Laser pulse energy [J].
        minimum_value: 0.0
        unit:
          ucum_code: J
      pulse_duration_fwhm:
        range: float
        description: Pulse duration at FWHM [s].
        minimum_value: 0.0
        unit:
          ucum_code: s
      focal_position:
        range: float
        description: Focal (waist) position along the propagation axis [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      cep_phase:
        range: float
        description: Carrier-envelope phase [rad].
        ifabsent: float(0)
        unit:
          ucum_code: rad
      polarization:
        range: LaserPolarizationEnum
        description: Laser polarization state.
      profile_type:
        range: LaserProfileTypeEnum
        description: Transverse intensity profile model.
        ifabsent: string(gaussian)
      laguerre_polynomial_order_p:
        range: integer
        description: >-
          Radial Laguerre-Gaussian mode index p (for
          ``profile_type = laguerre-gaussian``).
        ifabsent: int(0)
        minimum_value: 0
      flatness:
        range: integer
        description: >-
          Flatness order N of a flattened-Gaussian profile
          (for ``profile_type = flattened-gaussian``).
        ifabsent: int(6)
        minimum_value: 1

  LaserEnergyMeterElement:
    description: Laser energy-meter sub-model (no additional fields).
    class_uri: laura:LaserEnergyMeterElement

  LaserHalfWavePlateElement:
    description: Half-wave plate sub-model (no additional fields).
    class_uri: laura:LaserHalfWavePlateElement

  # -- Plasma sub-model -------------------------------------------------------

  PlasmaElement:
    description: Plasma channel parameters for a laser-driven plasma-accelerator stage.
    class_uri: laura:PlasmaElement
    attributes:
      density:
        range: float
        description: "Plasma (electron) number density [m^-^3]."
        minimum_value: 0.0
        unit:
          ucum_code: m-3
      species:
        range: string
        description: "Plasma species name (e.g., ``electron``)."
        ifabsent: string(electron)
      ramp_up:
        range: float
        description: Entrance density-ramp length [m].
        ifabsent: float(0.001)
        minimum_value: 0.0
        unit:
          ucum_code: m
      plateau:
        range: float
        description: Flat-top plateau length [m].
        ifabsent: float(0.001)
        minimum_value: 0.0
        unit:
          ucum_code: m
      ramp_down:
        range: float
        description: Exit density-ramp length [m].
        ifabsent: float(0.001)
        minimum_value: 0.0
        unit:
          ucum_code: m
      ramp_decay_length:
        range: float
        description: Exponential decay length of the density ramp [m].
        ifabsent: float(0.001)
        minimum_value: 0.0
        unit:
          ucum_code: m
      density_profile:
        range: boolean
        description: >-
          If True, use a user-defined profile; if False, use a flat-top
          model.
        ifabsent: false
      parabolic_coefficient:
        range: float
        description: Parabolic coefficient for a transverse density profile.
        ifabsent: float(0)

  # -- Shutter / Valve sub-models ---------------------------------------------

  ShutterElement:
    description: Shutter interlock configuration.
    class_uri: laura:ShutterElement
    attributes:
      interlocks:
        multivalued: true
        range: string
        description: Names of the interlocks guarding this shutter.
        aliases:
          - shutter_interlock_names

  ValveElement:
    description: Vacuum valve configuration (no additional fields).
    class_uri: laura:ValveElement

  # -- Lighting sub-model -----------------------------------------------------

  LightingElement:
    description: Lighting element (no additional fields currently defined).
    class_uri: laura:LightingElement

  # -- Degauss sub-model ------------------------------------------------------

  DegaussableElement:
    description: >-
      Degaussing (demagnetisation cycle) parameters for magnets that
      require a field-reset procedure.
    class_uri: laura:DegaussableElement
    in_subset:
      - magnetic_properties
    attributes:
      tolerance:
        range: float
        description: Current tolerance band during the degauss cycle [A].
        ifabsent: float(0.5)
        aliases:
          - degauss_tolerance
        unit:
          ucum_code: A
      values:
        multivalued: true
        range: float
        description: Sequence of peak currents applied during the degauss cycle [A].
        aliases:
          - degauss_values
        unit:
          ucum_code: A
      steps:
        range: integer
        description: Number of degauss steps per half-cycle.
        ifabsent: int(11)
        aliases:
          - num_degauss_steps
        minimum_value: 1

# ===============================================================================
# Element class hierarchy
# ===============================================================================

  # -- Root base element ------------------------------------------------------

  AcceleratorElement:
    description: >-
      Root base class for all LAURA accelerator elements.  Every lattice
      element is an instance of a concrete subclass identified by
      ``hardware_type``.
    tree_root: true
    class_uri: laura:AcceleratorElement
    attributes:
      name:
        identifier: true
        required: true
        range: string
        description: Unique element name within the machine.
      hardware_class:
        range: HardwareClassEnum
        required: true
        description: >-
          Functional category (e.g., ``Magnet``, ``Diagnostic``).
      hardware_type:
        range: string
        ifabsent: string(Generic)
        description: >-
          Python class name used for MODEL_REGISTRY dispatch.  Identifies
          the concrete subclass to instantiate when loading from YAML.
      hardware_model:
        range: string
        ifabsent: string(Generic)
        description: >-
          Model or variant name within the hardware type
          (e.g., ``Generic``, ``TESLA``).
      machine_area:
        range: string
        description: >-
          Machine area label grouping related elements
          (e.g., ``LINAC``, ``BA1``).
      virtual_name:
        range: string
        ifabsent: string()
        description: >-
          Alternative internal name used by the control system when the
          physical name is inaccessible.
      alias:
        range: string
        multivalued: true
        description: >-
          Human-readable aliases for the element. Populated from ``name_alias``
          in YAML. Accepts a single string or a list of strings.
        aliases:
          - name_alias
      subelement:
        range: string
        description: >-
          If set, this element is a logical sub-component of the named
          parent element.

  # -- Standard element -------------------------------------------------------

  StandardElement:
    is_a: AcceleratorElement
    description: >-
      Accelerator element with control-system, electrical, manufacturer,
      simulation, and reference sub-models.
    class_uri: laura:StandardElement
    attributes:
      simulation:
        range: SimulationElement
        description: Simulation / tracking attributes.
      electrical:
        range: ElectricalElement
        description: Power-supply electrical limits.
      manufacturer:
        range: ManufacturerElement
        description: Manufacturer and serial-number data.
      controls:
        range: ControlsInformation
        description: Control-system process-variable definitions.
      reference:
        range: ReferenceElement
        description: Links to design drawings and files.

  Element:
    is_a: StandardElement
    description: >-
      Concrete schema counterpart of the Python ``Element`` wrapper class.
      Inherits standard element composition fields.
    class_uri: laura:Element

  # -- Physical element -------------------------------------------------------

  PhysicalAcceleratorElement:
    is_a: Element
    description: >-
      Accelerator element with a well-defined physical position and
      orientation in the beamline.
    class_uri: laura:PhysicalAcceleratorElement
    attributes:
      physical:
        range: PhysicalElement
        description: Position, rotation, and length data.
        in_subset:
          - physical_properties

  # -- Magnet -----------------------------------------------------------------

  MagnetBaseElement:
    is_a: PhysicalAcceleratorElement
    description: >-
      Base class for all magnetic focusing and bending elements.
      (Named ``MagnetBaseElement`` in the schema to avoid collision with
      the ``magnetic`` composition-model class; maps to ``Magnet`` in Python.)
    class_uri: laura:MagnetBaseElement
    slot_usage:
      simulation:
        range: MagnetSimulationElement
    attributes:
      magnetic:
        range: MagneticElement
        description: Magnetic field parameters.
        in_subset:
          - magnetic_properties
      degauss:
        range: DegaussableElement
        description: Degaussing-cycle parameters.

  # -- Diagnostics ------------------------------------------------------------

  Diagnostic:
    is_a: PhysicalAcceleratorElement
    description: Base class for all beam-diagnostic instruments.
    class_uri: laura:Diagnostic
    slot_usage:
      simulation:
        range: DiagnosticSimulationElement
    attributes:
      diagnostic:
        range: DiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  BeamPositionMonitor:
    is_a: Diagnostic
    description: Beam-position monitor (BPM).
    class_uri: laura:BeamPositionMonitor
    slot_usage:
      hardware_type:
        equals_string: Beam_Position_Monitor
    attributes:
      diagnostic:
        range: BPMDiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  BeamArrivalMonitor:
    is_a: Diagnostic
    description: Beam-arrival-time monitor (BAM).
    class_uri: laura:BeamArrivalMonitor
    slot_usage:
      hardware_type:
        equals_string: Beam_Arrival_Monitor
    attributes:
      diagnostic:
        range: BAMDiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  BunchLengthMonitor:
    is_a: Diagnostic
    description: "Bunch-length monitor (BLM / CDR detector)."
    class_uri: laura:BunchLengthMonitor
    slot_usage:
      hardware_type:
        equals_string: Bunch_Length_Monitor
    attributes:
      diagnostic:
        range: BLMDiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  Camera:
    is_a: Diagnostic
    description: Camera-based beam-profile monitor.
    class_uri: laura:Camera
    slot_usage:
      hardware_type:
        equals_string: Camera
    attributes:
      diagnostic:
        range: CameraDiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  Screen:
    is_a: Diagnostic
    description: Scintillator or OTR screen with an associated camera.
    class_uri: laura:Screen
    slot_usage:
      hardware_type:
        equals_string: Screen
    attributes:
      diagnostic:
        range: ScreenDiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  ChargeDiagnostic:
    is_a: Diagnostic
    description: Base class for charge-measurement diagnostics.
    class_uri: laura:ChargeDiagnostic
    slot_usage:
      hardware_type:
        equals_string: ChargeDiagnostic
    attributes:
      diagnostic:
        range: ChargeDiagnosticElement
        description: Instrument-specific diagnostic parameters.
        in_subset:
          - diagnostic_properties

  WallCurrentMonitor:
    is_a: ChargeDiagnostic
    description: Wall-current monitor (WCM) for non-destructive charge measurement.
    class_uri: laura:WallCurrentMonitor
    slot_usage:
      hardware_type:
        equals_string: Wall_Current_Monitor

  FaradayCupMonitor:
    is_a: ChargeDiagnostic
    description: Faraday cup for destructive charge measurement.
    class_uri: laura:FaradayCupMonitor
    slot_usage:
      hardware_type:
        equals_string: Faraday_Cup_Monitor

  IntegratedCurrentTransformer:
    is_a: ChargeDiagnostic
    description: >-
      Integrated current transformer (ICT) for non-destructive single-shot
      charge measurement.
    class_uri: laura:IntegratedCurrentTransformer
    slot_usage:
      hardware_type:
        equals_string: Integrated_Current_Transformer

  # -- RF & Feedback elements -------------------------------------------------

  RFCavity:
    is_a: PhysicalAcceleratorElement
    description: Accelerating RF cavity.
    class_uri: laura:RFCavity
    slot_usage:
      hardware_type:
        equals_string: RFCavity
      simulation:
        range: RFCavitySimulationElement
    attributes:
      cavity:
        range: RFCavityElement
        description: RF structure parameters.
        in_subset:
          - rf_properties

  RFDeflectingCavity:
    is_a: RFCavity
    description: Transverse-deflecting (streak) RF cavity.
    class_uri: laura:RFDeflectingCavity
    slot_usage:
      hardware_type:
        equals_string: RFDeflectingCavity
    attributes:
      cavity:
        range: RFDeflectingCavityElement
        description: RF structure parameters.
        in_subset:
          - rf_properties

  Wakefield:
    is_a: PhysicalAcceleratorElement
    description: "Passive wakefield structure (dielectric, corrugated, etc.)."
    class_uri: laura:Wakefield
    slot_usage:
      hardware_type:
        equals_string: Wakefield
      simulation:
        range: WakefieldSimulationElement
    attributes:
      cavity:
        range: WakefieldElement
        description: Wakefield structure parameters.

  LowLevelRF:
    is_a: StandardElement
    description: Low-level RF (LLRF) controller.
    class_uri: laura:LowLevelRF
    slot_usage:
      hardware_type:
        equals_string: Low_Level_RF
    attributes:
      llrf:
        range: LowLevelRFElement
        description: LLRF parameters.

  RFModulator:
    is_a: StandardElement
    description: RF modulator (klystron driver) element.
    class_uri: laura:RFModulator
    slot_usage:
      hardware_type:
        equals_string: RFModulator
    attributes:
      modulator:
        range: RFModulatorElement
        description: Modulator parameters.

  RFProtection:
    is_a: StandardElement
    description: RF protection system element.
    class_uri: laura:RFProtection
    slot_usage:
      hardware_type:
        equals_string: RFProtection
    attributes:
      protection:
        range: RFProtectionElement
        description: RF protection parameters.

  RFHeartbeat:
    is_a: StandardElement
    description: RF timing heartbeat / signal-monitor element.
    class_uri: laura:RFHeartbeat
    slot_usage:
      hardware_type:
        equals_string: RFHeartbeat
    attributes:
      heartbeat:
        range: RFHeartbeatElement
        description: RF heartbeat parameters.

  PID:
    is_a: StandardElement
    description: Proportional-integral-derivative (PID) feedback controller.
    class_uri: laura:PID
    slot_usage:
      hardware_type:
        equals_string: PID
    attributes:
      pid:
        range: PIDElement
        description: PID gain parameters.

  # -- Other physically-located elements --------------------------------------

  TwissMatch:
    is_a: PhysicalAcceleratorElement
    description: >-
      Virtual Twiss-parameter matching point -- a zero-length marker that
      defines the desired optical functions at a location in the lattice.
    class_uri: laura:TwissMatch
    slot_usage:
      hardware_type:
        equals_string: TwissMatch
      simulation:
        range: TwissMatchSimulationElement

  Stage:
    is_a: PhysicalAcceleratorElement
    description: Motorised positioning stage.
    class_uri: laura:Stage
    slot_usage:
      hardware_type:
        equals_string: Stage

  VacuumGauge:
    is_a: PhysicalAcceleratorElement
    description: Vacuum-pressure gauge.
    class_uri: laura:VacuumGauge
    slot_usage:
      hardware_type:
        equals_string: VacuumGauge

  Laser:
    is_a: PhysicalAcceleratorElement
    description: Laser system element (full laser setup including beam parameters).
    class_uri: laura:Laser
    in_subset:
      - laser_properties
    slot_usage:
      hardware_type:
        equals_string: Laser
    attributes:
      laser:
        range: LaserElement
        description: Laser-beam parameters.

  Shutter:
    is_a: PhysicalAcceleratorElement
    description: Beam or laser shutter with interlock logic.
    class_uri: laura:Shutter
    slot_usage:
      hardware_type:
        equals_string: Shutter
    attributes:
      shutter:
        range: ShutterElement
        description: Shutter interlock configuration.

  Valve:
    is_a: PhysicalAcceleratorElement
    description: Vacuum gate valve.
    class_uri: laura:Valve
    slot_usage:
      hardware_type:
        equals_string: Valve
    attributes:
      valve:
        range: ValveElement
        description: Valve configuration.

  Marker:
    is_a: PhysicalAcceleratorElement
    description: >-
      Virtual survey marker -- a zero-length reference point used for
      alignment.
    class_uri: laura:Marker
    slot_usage:
      hardware_type:
        equals_string: Marker

  Aperture:
    is_a: PhysicalAcceleratorElement
    description: Mechanical aperture restriction in the beam pipe.
    class_uri: laura:Aperture
    slot_usage:
      hardware_type:
        equals_string: Aperture
    attributes:
      aperture:
        range: ApertureElement
        description: Aperture geometry parameters.

  Collimator:
    is_a: Aperture
    description: Movable collimator jaw (extends Aperture).
    class_uri: laura:Collimator
    slot_usage:
      hardware_type:
        equals_string: Collimator

  Drift:
    is_a: PhysicalAcceleratorElement
    description: Field-free drift space between elements.
    class_uri: laura:Drift
    slot_usage:
      hardware_type:
        equals_string: Drift
      simulation:
        range: DriftSimulationElement

  Plasma:
    is_a: PhysicalAcceleratorElement
    description: Laser-driven plasma-accelerator stage.
    class_uri: laura:Plasma
    slot_usage:
      hardware_type:
        equals_string: Plasma
      simulation:
        range: PlasmaSimulationElement
    attributes:
      plasma:
        range: PlasmaElement
        description: Plasma channel parameters.
      laser:
        range: LaserElement
        description: Laser driving the plasma stage.

  # -- Non-physical (no position) elements -----------------------------------

  LaserEnergyMeter:
    is_a: StandardElement
    description: Laser pulse-energy diagnostic (photodiode / pyroelectric).
    class_uri: laura:LaserEnergyMeter
    in_subset:
      - laser_properties
    slot_usage:
      hardware_type:
        equals_string: LaserEnergyMeter
    attributes:
      laser:
        range: LaserEnergyMeterElement
        description: Energy-meter instrument parameters.

  LaserHalfWavePlate:
    is_a: StandardElement
    description: Half-wave plate for laser polarisation rotation.
    class_uri: laura:LaserHalfWavePlate
    in_subset:
      - laser_properties
    slot_usage:
      hardware_type:
        equals_string: LaserHalfWavePlate
    attributes:
      laser:
        range: LaserHalfWavePlateElement
        description: Half-wave plate parameters.

  LaserMirror:
    is_a: StandardElement
    description: Laser steering or focusing mirror.
    class_uri: laura:LaserMirror
    in_subset:
      - laser_properties
    slot_usage:
      hardware_type:
        equals_string: LaserMirror
    attributes:
      laser:
        range: LaserMirrorElement
        description: Mirror steering parameters.

  LaserMirrorElement:
    description: Mirror steering parameters for a laser mirror.
    class_uri: laura:LaserMirrorElement
    attributes:
      step_max:
        range: float
        description: Maximum step size for mirror adjustment.
      sense:
        range: LaserMirrorSense
        description: Mirror sense/interlock configuration.
      vertical_channel:
        range: integer
        description: Vertical control channel index.
      horizontal_channel:
        range: integer
        description: Horizontal control channel index.

  LaserMirrorSense:
    description: Mirror sense switch values.
    class_uri: laura:LaserMirrorSense
    attributes:
      left:
        range: float
        description: Left sense value.
        aliases: [left_sense]
      right:
        range: float
        description: Right sense value.
        aliases: [right_sense]
      up:
        range: float
        description: Up sense value.
        aliases: [up_sense]
      down:
        range: float
        description: Down sense value.
        aliases: [down_sense]

  LaserAttenuator:
    is_a: StandardElement
    description: Laser power attenuator (waveplate + polariser combination).
    class_uri: laura:LaserAttenuator
    in_subset:
      - laser_properties
    slot_usage:
      hardware_type:
        equals_string: LaserAttenuator
    attributes:
      maximum:
        range: float
        description: Maximum attenuation angle [deg].
        unit:
          ucum_code: deg
      minimum:
        range: float
        description: Minimum attenuation angle [deg].
        unit:
          ucum_code: deg

  Lighting:
    is_a: StandardElement
    description: Experimental-hall lighting element.
    class_uri: laura:Lighting
    slot_usage:
      hardware_type:
        equals_string: Lighting
    attributes:
      lights:
        range: LightingElement
        description: Lighting configuration.

  # -- Machine structure ------------------------------------------------------

  SectionLattice:
    description: >-
      An ordered list of element names defining a contiguous beamline
      section.
    class_uri: laura:SectionLattice
    attributes:
      name:
        identifier: true
        range: string
        description: Unique section name.
      master_lattice:
        range: string
        description: Name of the master lattice this section belongs to.
      elements:
        multivalued: true
        range: string
        description: Ordered list of element names in this section.

  MachineLayout:
    description: >-
      An ordered list of section names defining a beamline layout
      (a contiguous sequence of sections).
    class_uri: laura:MachineLayout
    attributes:
      name:
        identifier: true
        range: string
        description: Unique layout name.
      master_lattice:
        range: string
        description: Name of the master lattice this layout belongs to.
      sections:
        multivalued: true
        range: string
        description: Ordered list of section names.

  MachineModel:
    description: >-
      Top-level container for a complete accelerator lattice: elements,
      sections, layouts, and named lattice configurations.
    class_uri: laura:MachineModel
    attributes:
      elements:
        multivalued: true
        range: AcceleratorElement
        description: All elements in the machine, keyed by name.
      sections:
        multivalued: true
        range: SectionLattice
        description: All named beamline sections.
      layouts:
        multivalued: true
        range: MachineLayout
        description: All named beamline layouts.
