id: https://w3id.org/laura/schema/simulation
name: laura_simulation_schema
title: LAURA Simulation Model Chunk
description: >-
  Simulation-related schema classes for field maps, tracking, wakefields,
  diagnostics, plasma stages, and Twiss-matching points.
version: "0.1.0"
license: Apache Software License 2.0

prefixes:
  linkml:  https://w3id.org/linkml/
  laura:   https://w3id.org/laura/
  qudt:    http://qudt.org/schema/qudt/
  unit:    http://qudt.org/vocab/unit/
  schema:  http://schema.org/
  skos:    http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  obo:     http://purl.obolibrary.org/obo/
  xsd:     http://www.w3.org/2001/XMLSchema#

default_prefix: laura
default_range: string

imports:
  - linkml:types

classes:

  MatrixValue:
    class_uri: linkml:Any
    description: >-
      An unconstrained serializable matrix value. The handwritten matrix model
      validates dense arrays and named coefficient mappings into NumPy arrays.

  SimulationElement:
    description: >-
      Base simulation attributes: field-map files and reference positions
      for tracking codes.
    class_uri: laura:SimulationElement
    attributes:
      field_definition:
        range: string
        description: Path to the 3-D field-map file.
      wakefield_definition:
        range: string
        description: Path to the wakefield impedance file.
      wakefield_enable:
        range: boolean
        ifabsent: "true"
        description: >-
          Whether the wakefield named by wakefield_definition is applied. Set
          false to track the element without its wakefield while keeping the
          definition itself.
      field_reference_position:
        range: string
        description: Longitudinal origin of the field map [m].
      scale_field:
        range: double
        description: Multiplicative scale factor applied to the field map.
        ifabsent: float(1)

  MagnetSimulationElement:
    is_a: SimulationElement
    description: >-
      Simulation attributes specific to magnets: integrator settings,
      fringe-field model, and radiation flags.
    class_uri: laura:MagnetSimulationElement
    slots:
      - n_kicks
      - field_amplitude
    slot_usage:
      n_kicks:
        description: Number of integration kicks.
        ifabsent: int(4)
        minimum_value: 1
      field_amplitude:
        description: Field amplitude scaling for magnet tracking.
        ifabsent: float(0.0)
    attributes:
      n_slices:
        range: integer
        description: Number of longitudinal slices for thick-lens tracking.
        ifabsent: int(4)
        minimum_value: 1
      smooth:
        range: integer
        description: Number of smoothing passes applied to the field map (ASTRA Q_smooth / S_smooth).
      edge_field_integral:
        range: double
        description: Fringe-field integral for edge focussing.
        ifabsent: float(0.5)
      edge1_effects:
        range: boolean
        description: Enable entrance-edge focussing effects.
      edge2_effects:
        range: boolean
        description: Enable exit-edge focussing effects.
      sr_enable:
        range: boolean
        description: Enable synchrotron-radiation energy loss.
        ifabsent: "True"
      isr_enable:
        range: boolean
        description: Enable incoherent synchrotron-radiation emittance growth.
        ifabsent: "True"
      csr_enable:
        range: boolean
        description: Enable coherent synchrotron radiation.
        ifabsent: "True"
      csr_bins:
        range: integer
        description: Number of longitudinal bins for the CSR mesh.
        ifabsent: int(100)
      integration_order:
        range: integer
        description: Order of the symplectic integrator.
        ifabsent: int(4)
      nonlinear:
        range: boolean
        description: Include higher-order (sextupole+) field components.
      smoothing_half_width:
        range: integer
        description: Half-width of the current-profile smoothing kernel.
        ifabsent: int(1)
      edge_order:
        range: integer
        description: Polynomial order of the edge-field expansion.
        ifabsent: int(2)
      deltaL:
        range: double
        description: Longitudinal step-size override for thick-lens integration [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      smooth_points:
        range: double
        description: Number of points used to smooth the field map [ASTRA].
        ifabsent: float(2)

  RFCavitySimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for RF cavity elements.
    class_uri: laura:RFCavitySimulationElement
    slots:
      - t_column
      - z_column
      - wx_column
      - wy_column
      - wz_column
      - n_kicks
      - lsc_bins
    slot_usage:
      n_kicks:
        description: Number of cavity kicks to apply.
        ifabsent: int(0)
      lsc_bins:
        description: Number of longitudinal space-charge bins.
        ifabsent: int(100)
    attributes:
      change_p0:
        range: integer
        description: Flag indicating whether the cavity changes reference momentum.
        ifabsent: int(1)
      end1_focus:
        range: integer
        description: Apply entrance focusing.
        ifabsent: int(1)
      end2_focus:
        range: integer
        description: Apply exit focusing.
        ifabsent: int(1)
      body_focus_model:
        range: string
        description: Cavity body focusing model.
        ifabsent: string(SRS)
      current_bins:
        range: integer
        description: Number of current bins.
        ifabsent: int(0)
      interpolate_current_bins:
        range: integer
        description: Flag indicating current-bin interpolation.
        ifabsent: int(1)
      smooth_current_bins:
        range: integer
        description: Flag indicating current-bin smoothing.
        ifabsent: int(1)
      smooth:
        range: integer
        description: Cavity smoothing parameter.
      ez_peak:
        range: double
        description: Peak longitudinal electric field.
      field_file_name:
        range: string
        description: Cavity field file name.
      wakefile:
        range: string
        description: Wake file name.
      zwakefile:
        range: string
        description: Longitudinal wake file name.
      trwakefile:
        range: string
        description: Transverse wake file name.
      field_amplitude:
        range: double
        any_of:
          - range: double
          - range: string
        in_subset:
          - functional_parameters
        required: true
        description: Cavity field amplitude.

  WakefieldSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for passive wakefield structures.
    class_uri: laura:WakefieldSimulationElement
    slots:
      - t_column
      - z_column
      - wx_column
      - wy_column
      - wz_column
    attributes:
      allow_long_beam:
        range: boolean
        description: Allow beams longer than the wakefield.
        ifabsent: "True"
      bunched_beam:
        range: boolean
        description: Use bunched beam mode.
        ifabsent: "False"
      change_momentum:
        range: boolean
        description: Allow wakefield to change bunch momentum.
        ifabsent: "True"
      factor:
        range: double
        description: Wake scaling factor.
        ifabsent: float(1)
      interpolate:
        range: boolean
        description: Interpolate points in wake file.
        ifabsent: "True"
      scale_kick:
        range: double
        description: Factor by which to scale wake kicks.
        ifabsent: float(1)
      scale_field_ex:
        range: double
        description: x-component of the longitudinal direction vector.
        ifabsent: float(0.0)
      scale_field_ey:
        range: double
        description: y-component of the longitudinal direction vector.
        ifabsent: float(0.0)
      scale_field_ez:
        range: double
        description: z-component of the longitudinal direction vector.
        ifabsent: float(1.0)
      scale_field_hx:
        range: double
        description: x-component of the horizontal direction vector.
        ifabsent: float(1.0)
      scale_field_hy:
        range: double
        description: y-component of the horizontal direction vector.
        ifabsent: float(0.0)
      scale_field_hz:
        range: double
        description: z-component of the horizontal direction vector.
        ifabsent: float(0.0)
      equal_grid:
        range: double
        description: Interpolation between equidistant and equal-charge grids.
        ifabsent: float(0.66)
      interpolation_method:
        range: integer
        description: Interpolation method for ASTRA.
        ifabsent: int(2)
      smooth:
        range: double
        description: Smoothing parameter for Gaussian interpolation.
        ifabsent: float(0.25)
      subbins:
        range: integer
        description: Sub-binning parameter.
        ifabsent: int(10)

  DriftSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for field-free drift sections.
    class_uri: laura:DriftSimulationElement
    slots:
      - lsc_bins
    slot_usage:
      lsc_bins:
        description: Number of bins for LSC calculations.
        ifabsent: int(20)
    attributes:
      lsc_interpolate:
        range: integer
        description: Flag to allow interpolation of computed LSC wake.
        ifabsent: int(1)
      csr_enable:
        range: boolean
        description: Enable CSR drift calculations.
        ifabsent: "True"
      lsc_enable:
        range: boolean
        description: Enable LSC drift calculations.
        ifabsent: "True"
      use_stupakov:
        range: integer
        description: Use Stupakov formula.
        ifabsent: int(1)
      csrdz:
        range: double
        description: Step size for CSR calculations.
        ifabsent: float(0.01)
      lsc_high_frequency_cutoff_start:
        range: double
        description: High-frequency cutoff start for LSC.
      lsc_high_frequency_cutoff_end:
        range: double
        description: High-frequency cutoff end for LSC.
      lsc_low_frequency_cutoff_start:
        range: double
        description: Low-frequency cutoff start for LSC.
      lsc_low_frequency_cutoff_end:
        range: double
        description: Low-frequency cutoff end for LSC.

  DiagnosticSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for beam-diagnostic elements.
    class_uri: laura:DiagnosticSimulationElement
    attributes:
      output_filename:
        range: string
        description: Output filename for diagnostic data.

  PlasmaSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for plasma-accelerator stages.
    class_uri: laura:PlasmaSimulationElement
    attributes:
      wakefield_model:
        range: string
        description: Wakefield model identifier.
      bunch_pusher:
        range: string
        description: Pusher used to evolve bunch particles in time.
        ifabsent: string(boris)
      dt_bunch:
        range: string
        description: Time-step control for bunch evolution (or 'auto').
        ifabsent: string(auto)
      n_out:
        range: integer
        description: Number of distribution dumps during the plasma stage.
        ifabsent: int(1)
      min_longitudinal_position:
        range: double
        description: Minimum longitudinal position [m].
        ifabsent: float(0)
      max_longitudinal_position:
        range: double
        description: Maximum longitudinal position [m].
        ifabsent: float(0)
      n_longitudinal:
        range: integer
        description: Number of grid points in the longitudinal direction.
        ifabsent: int(0)
      n_radial:
        range: integer
        description: Number of grid points in the radial direction.
        ifabsent: int(0)
      plasma_particles_per_cell:
        range: integer
        description: Number of plasma particles per cell.
        ifabsent: int(2)
      r_max:
        range: double
        description: Radial extent of the simulation box [m].
        ifabsent: float(0)
      r_max_plasma:
        range: double
        description: Maximum radial extension of the plasma column.
      dz_fields:
        range: double
        description: Interval for plasma wakefield updates.
      plasma_pusher:
        range: string
        description: Pusher used to evolve the plasma in time.
        ifabsent: string(boris)

  TwissMatchSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for Twiss-matching points.
    class_uri: laura:TwissMatchSimulationElement
    attributes:
      beta_x:
        range: double
        description: Horizontal beta.
      beta_y:
        range: double
        description: Vertical beta.
      alpha_x:
        range: double
        description: Horizontal alpha.
      alpha_y:
        range: double
        description: Vertical alpha.
      eta_x:
        range: double
        description: Horizontal dispersion.
        ifabsent: float(0.0)
      eta_y:
        range: double
        description: Vertical dispersion.
        ifabsent: float(0.0)
      eta_xp:
        range: double
        description: Horizontal dispersion derivative.
        ifabsent: float(0.0)
      eta_yp:
        range: double
        description: Vertical dispersion derivative.
        ifabsent: float(0.0)
      from_beam:
        range: boolean
        description: Compute transform from tracked beam properties.
        ifabsent: "True"

  MatrixTransformSimulationElement:
    is_a: SimulationElement
    description: >-
      Zero-, first-, and second-order transfer-map coefficients for a matrix
      transform element. Each coefficient collection accepts the dense form or
      the named coefficient mapping understood by the Python model.
    class_uri: laura:MatrixTransformSimulationElement
    attributes:
      apply:
        range: boolean
        description: Whether to apply the transfer map.
        ifabsent: "False"
      c_matrix:
        range: MatrixValue
        description: C-matrix (zeroth-order transfer vector).
      r_matrix:
        range: MatrixValue
        description: R-matrix (first-order transfer matrix).
      t_matrix:
        range: MatrixValue
        description: T-matrix (second-order transfer tensor).

  ElectrostaticSeparatorSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for a static electrostatic separator.
    class_uri: laura:ElectrostaticSeparatorSimulationElement
    attributes:
      horizontal_field:
        range: double
        any_of:
          - range: double
          - range: string
        in_subset:
          - functional_parameters
        description: Horizontal deflecting electric field [V/m].
        ifabsent: float(0.0)
        unit:
          ucum_code: V/m
      vertical_field:
        range: double
        any_of:
          - range: double
          - range: string
        in_subset:
          - functional_parameters
        description: Vertical deflecting electric field [V/m].
        ifabsent: float(0.0)
        unit:
          ucum_code: V/m
      tilt:
        range: double
        description: Rotation about the beam axis [rad].
        ifabsent: float(0.0)
        unit:
          ucum_code: rad

  ACDipoleSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for an AC dipole / tune exciter.
    class_uri: laura:ACDipoleSimulationElement
    slots:
      - field_amplitude
      - frequency
      - phase
    slot_usage:
      field_amplitude:
        description: Peak kick voltage/amplitude of the exciter.
        ifabsent: float(0.0)
      frequency:
        description: Drive frequency [Hz].
        ifabsent: float(0.0)
      phase:
        description: Phase lag [deg].
        ifabsent: float(0.0)
    attributes:
      ramp:
        range: integer
        multivalued: true
        description: Turn numbers [ramp1, ramp2, ramp3, ramp4] defining the drive ramp.

  WireSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for a compensating wire.
    class_uri: laura:WireSimulationElement
    attributes:
      current:
        range: double
        description: Current carried by the wire [A].
        ifabsent: float(0.0)
        unit:
          ucum_code: A
      interaction_length:
        range: double
        description: Effective interaction length [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      horizontal_offset:
        range: double
        description: Horizontal wire offset from the reference orbit [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      vertical_offset:
        range: double
        description: Vertical wire offset from the reference orbit [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m

  BeamBeamSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for a weak-strong beam-beam interaction.
    class_uri: laura:BeamBeamSimulationElement
    attributes:
      charge:
        range: double
        description: Opposing-beam particle charge in units of the elementary charge.
        ifabsent: float(1.0)
      n_particles:
        range: double
        description: Number of particles in the opposing bunch.
        ifabsent: float(0.0)
      horizontal_offset:
        range: double
        description: Horizontal opposing-bunch centroid offset [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      vertical_offset:
        range: double
        description: Vertical opposing-bunch centroid offset [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      horizontal_sigma:
        range: double
        description: Horizontal RMS size of the opposing bunch [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      vertical_sigma:
        range: double
        description: Vertical RMS size of the opposing bunch [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m
      width:
        range: double
        description: Opposing-bunch length for the 3-D weak-strong model [m].
        ifabsent: float(0.0)
        unit:
          ucum_code: m

  RFMultipoleSimulationElement:
    is_a: SimulationElement
    description: Simulation attributes for a thin RF multipole kick.
    class_uri: laura:RFMultipoleSimulationElement
    slots:
      - frequency
      - phase
      - field_amplitude
    slot_usage:
      frequency:
        description: RF frequency [Hz].
        ifabsent: float(0.0)
      phase:
        description: Overall phase lag [deg].
        ifabsent: float(0.0)
      field_amplitude:
        description: Longitudinal voltage [V].
        ifabsent: float(0.0)
    attributes:
      knl:
        range: double
        multivalued: true
        description: Integrated normal multipole strengths, dipole through decapole.
      ksl:
        range: double
        multivalued: true
        description: Integrated skew multipole strengths, dipole through decapole.
      pnl:
        range: double
        multivalued: true
        description: Normal multipole phases [deg], dipole through decapole.
      psl:
        range: double
        multivalued: true
        description: Skew multipole phases [deg], dipole through decapole.