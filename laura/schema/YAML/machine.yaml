id: https://w3id.org/laura/schema/machine
name: laura_machine_schema
title: LAURA Machine Model Chunk
description: >-
  Section, layout and whole-machine container classes.
version: "0.1.0"
license: Apache Software License 2.0

prefixes:
  linkml:  https://w3id.org/linkml/
  laura:   https://w3id.org/laura/
  qudt:    http://qudt.org/schema/qudt/
  unit:    http://qudt.org/vocab/unit/
  schema:  http://schema.org/
  skos:    http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  obo:     http://purl.obolibrary.org/obo/
  xsd:     http://www.w3.org/2001/XMLSchema#

default_prefix: laura
default_range: string

# This is a chunk of the LAURA schema, not a standalone model: classes here
# refer to slots and base classes defined in laura_schema.yaml, which imports
# this file. Always generate from laura_schema.yaml, never from this file.
imports:
  - linkml:types

enums:

  LatticeGeometryEnum:
    description: >-
      Whether the reference orbit closes on itself. Mirrors Bmad's
      ``parameter[geometry]``.
    permissible_values:
      open:
        description: >-
          Single-pass beamline such as a linac or transfer line. Twiss
          parameters propagate from a specified starting condition.
      closed:
        description: >-
          Recirculating machine such as a storage ring, for which closed
          orbits and periodic Twiss parameters are computed.

classes:

  SectionLattice:
    description: >-
      An ordered list of element names defining a contiguous beamline
      section.
    class_uri: laura:SectionLattice
    attributes:
      name:
        identifier: true
        range: string
        description: Unique section name.
      master_lattice:
        range: string
        description: Name of the master lattice this section belongs to.
      geometry:
        range: LatticeGeometryEnum
        required: false
        description: >-
          Whether the reference orbit closes on itself. Per-section rather
          than per-machine because a forked branch may differ from its
          parent.
      reference_energy:
        range: float
        required: false
        description: Reference total energy of the design particle [eV].
        minimum_value: 0.0
        unit:
          ucum_code: eV
      elements:
        multivalued: true
        range: string
        description: Ordered list of element names in this section.

  MachineLayout:
    description: >-
      An ordered list of section names defining a beamline layout
      (a contiguous sequence of sections).
    class_uri: laura:MachineLayout
    attributes:
      name:
        identifier: true
        range: string
        description: Unique layout name.
      master_lattice:
        range: string
        description: Name of the master lattice this layout belongs to.
      particle:
        range: string
        required: false
        description: >-
          Design particle species for this layout, overriding the
          machine-wide value. Free text rather than an enum because the
          accepted set includes arbitrary ions (e.g. ``#12C+3``) alongside
          the fundamental particles.
      sections:
        multivalued: true
        range: string
        description: Ordered list of section names.

  MachineModel:
    description: >-
      Top-level container for a complete accelerator lattice: elements,
      sections, layouts, and named lattice configurations.
    class_uri: laura:MachineModel
    attributes:
      particle:
        range: string
        required: false
        description: >-
          Machine-wide design particle species, overridable per layout. Free
          text rather than an enum because the accepted set includes
          arbitrary ions (e.g. ``#12C+3``) alongside the fundamental
          particles.
      elements:
        multivalued: true
        range: AcceleratorElement
        description: All elements in the machine, keyed by name.
      sections:
        multivalued: true
        range: SectionLattice
        description: All named beamline sections.
      layouts:
        multivalued: true
        range: MachineLayout
        description: All named beamline layouts.
