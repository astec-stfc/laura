# Keys are pybdsim.Builder class names (see conversion_rules/codes/
# bdsim_conversion.py), so they must match those class names exactly -- this
# file is looked up by `obj.__name__`. Values are the gmad keywords that
# element accepts (BDSIM manual, "Beamline Elements"); `tilt` is valid on
# every element. pybdsim's Marker takes only a name -- it has no **kwargs, so
# passing any other keyword (including a beam-pipe aperture) raises TypeError.
