    Close:
      control_type: binary
      description: Command PV to close the vacuum valve, activate signal must be sent
        after setting this PV.
      dtype: int
      identifier: CLA-S02-VAC-VALV-01:Off
      protocol: CA
      read_only: false
    Open:
      control_type: binary
      description: Command PV to open the vacuum valve, activate signal must be sent
        after setting this PV.
      dtype: int
      identifier: CLA-S02-VAC-VALV-01:On
      protocol: CA
      read_only: false
    Sta:
      control_type: state
      description: Reports back the current state of the vacuum valve.
      dtype: int
      identifier: CLA-S02-VAC-VALV-01:Sta
      protocol: CA
      states:
        CLOSED: 0
        MOVING: 2
        OPEN: 1
