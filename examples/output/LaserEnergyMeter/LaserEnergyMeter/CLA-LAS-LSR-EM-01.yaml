controls:
  variables:
    ENERGYREADBACK:
      description: Readback of the measured laser energy
      dtype: float
      identifier: CLA-LAS-LSR-EM-01:E_RB
      protocol: CA
      units: uJ
    OVERRANGE:
      control_type: binary
      description: State of energy readback being over-range set in RANGESP
      dtype: int
      identifier: CLA-LAS-LSR-EM-01:OverRange_RB
      protocol: CA
    RANGESP:
      control_type: state
      description: Set the state range for energy readback
      dtype: int
      identifier: CLA-LAS-LSR-EM-01:Range_SP
      protocol: CA
      read_only: false
      states:
        micro2: 1
        micro20: 0
        nano20: 3
        nano200: 2
    RUNSP:
      control_type: binary
      description: Enable/Disable the energy meter
      dtype: int
      identifier: CLA-LAS-LSR-EM-01:Run_SP
      protocol: CA
      read_only: false
electrical: {}
hardware_class: LaserEnergyMeter
hardware_type: LaserEnergyMeter
laser: {}
machine_area: LAS
manufacturer: {}
name: CLA-LAS-LSR-EM-01
simulation:
  scale_field: 0.0
