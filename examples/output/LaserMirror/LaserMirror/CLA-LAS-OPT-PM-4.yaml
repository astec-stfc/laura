controls:
  variables:
    H_ABSMOVE:
      control_type: binary
      description: Move the mirror to the position in mm (not VC position) H_SETABSPOS
      dtype: int
      identifier: CLA-LAS-OPT-PM-4:H:AbsMove.PROC
      protocol: CA
      read_only: false
    H_GETABSPOS:
      control_type: scalar
      description: Absolute horizontal position in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:H:RealPos?
      protocol: CA
    H_GETREFPOS:
      control_type: scalar
      description: Read reference horizontal position in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:H:GetRef
      protocol: CA
    H_JOGNEG:
      control_type: binary
      description: Jog the mirror horizontally by -H_MREL
      dtype: int
      identifier: CLA-LAS-OPT-PM-4:H:JogNegX.PROC
      protocol: CA
      read_only: false
    H_JOGPLUS:
      control_type: binary
      description: Jog the mirror horizontally by +H_MREL
      dtype: int
      identifier: CLA-LAS-OPT-PM-4:H:JogPlusX.PROC
      protocol: CA
      read_only: false
    H_MREL:
      control_type: scalar
      description: horizontal step size in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:H:SetX
      protocol: CA
      read_only: false
    H_SETABSPOS:
      control_type: scalar
      description: Set target absolute position (horizontal) in mm (not VC position)
        of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:H:SetAbsPos
      protocol: CA
      read_only: false
    H_SETREFPOS:
      control_type: scalar
      description: Set reference horizontal position in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:H:SetRefVal
      protocol: CA
      read_only: false
    V_ABSMOVE:
      control_type: binary
      description: Move the mirror to the position in mm (not VC position) V_SETABSPOS
      dtype: int
      identifier: CLA-LAS-OPT-PM-4:V:AbsMove.PROC
      protocol: CA
      read_only: false
    V_GETABSPOS:
      control_type: scalar
      description: Absolute vertical position in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:V:RealPos?
      protocol: CA
    V_GETREFPOS:
      control_type: scalar
      description: Read reference vertical position in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:V:GetRef
      protocol: CA
    V_JOGNEG:
      control_type: binary
      description: Jog the mirror horizontally by -V_MREL
      dtype: int
      identifier: CLA-LAS-OPT-PM-4:V:JogNegX.PROC
      protocol: CA
      read_only: false
    V_JOGPLUS:
      control_type: binary
      description: Jog the mirror horizontally by +V_MREL
      dtype: int
      identifier: CLA-LAS-OPT-PM-4:V:JogPlusX.PROC
      protocol: CA
      read_only: false
    V_MREL:
      control_type: scalar
      description: Vertical horizontal step size in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:V:SetX
      protocol: CA
      read_only: false
      units: mm
    V_SETABSPOS:
      control_type: scalar
      description: Set target absolute position (vertical) in mm (not VC position)
        of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:V:SetAbsPos
      protocol: CA
      read_only: false
    V_SETREFPOS:
      control_type: scalar
      description: Set reference vertical position in mm (not VC position) of motor
      dtype: float
      identifier: CLA-LAS-OPT-PM-4:V:SetRefVal
      protocol: CA
      read_only: false
electrical: {}
hardware_class: LaserMirror
hardware_type: LaserMirror
machine_area: LAS
manufacturer: {}
name: CLA-LAS-OPT-PM-4
simulation:
  scale_field: 0.0
