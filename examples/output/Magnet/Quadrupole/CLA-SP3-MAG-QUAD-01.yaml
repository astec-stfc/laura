controls:
  variables:
    GETSETI:
      control_type: scalar
      description: Gets the value of the target current for a magnet power supply.
      dtype: float
      identifier: CLA-SP3-MAG-QUAD-01:GETSETI
      protocol: CA
      units: A
    ILK_OFF:
      control_type: binary
      description: If the interlocks are clear, this disables them
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:Off
      protocol: CA
      read_only: false
    ILK_ON:
      control_type: binary
      description: If the interlocks are clear, this enables them
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:On
      protocol: CA
      read_only: false
    ILK_PSU_RESET:
      control_type: binary
      description: Reset the magnet power supply interlocks
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:RESET
      protocol: CA
      read_only: false
    ILK_RESET:
      control_type: binary
      description: Resets the magnet interlocks
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:Rst
      protocol: CA
      read_only: false
    READI:
      description: Gets the readback current of a magnet power supply.
      dtype: float
      identifier: CLA-SP3-MAG-QUAD-01:READI
      protocol: CA
      units: A
    READK:
      description: Reads the calculated K value for a magnet based on momentum of
        the section
      dtype: float
      identifier: CLA-SP3-MAG-QUAD-01:CalcK
      protocol: CA
    RILK:
      control_type: state
      description: Gets the interlock state for a magnet
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:RILK
      protocol: CA
      states:
        OK: 0
        TRIPPED: 1
    RPOWER:
      control_type: state
      description: Gets the state of a power supply
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:RPOWER
      protocol: CA
      states:
        'OFF': 0
        'ON': 1
    SETI:
      control_type: scalar
      description: Sets the target current for a magnet power supply.
      dtype: float
      identifier: CLA-SP3-MAG-QUAD-01:SETI
      protocol: CA
      read_only: false
      units: A
    SETK:
      control_type: scalar
      description: Sets the target field strength for a magnet. This ultimately sets
        a current for the power supply
      dtype: float
      identifier: CLA-SP3-MAG-QUAD-01:SETK
      protocol: CA
      read_only: false
      units: K
    SPOWER:
      control_type: state
      description: Sets the state of a power supply
      dtype: int
      identifier: CLA-SP3-MAG-QUAD-01:SPOWER
      protocol: CA
      read_only: false
      states:
        'OFF': 0
        'ON': 1
