controls:
  variables:
    GETSETI:
      control_type: scalar
      description: Gets the value of the target current for a magnet power supply.
      dtype: float
      identifier: CLA-VBC-MAG-DIP-02:GETSETI
      protocol: CA
      units: A
    ILK_OFF:
      control_type: binary
      description: If the interlocks are clear, this disables them
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:Off
      protocol: CA
      read_only: false
    ILK_ON:
      control_type: binary
      description: If the interlocks are clear, this enables them
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:On
      protocol: CA
      read_only: false
    ILK_PSU_RESET:
      control_type: binary
      description: Reset the magnet power supply interlocks
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:RESET
      protocol: CA
      read_only: false
    ILK_RESET:
      control_type: binary
      description: Resets the magnet interlocks
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:Rst
      protocol: CA
      read_only: false
    READI:
      description: Gets the readback current of a magnet power supply.
      dtype: float
      identifier: CLA-VBC-MAG-DIP-02:READI
      protocol: CA
      units: A
    READK:
      description: Reads the calculated K value for a magnet based on momentum of
        the section
      dtype: float
      identifier: CLA-VBC-MAG-DIP-02:CalcK
      protocol: CA
    RILK:
      control_type: state
      description: Gets the interlock state for a magnet
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:RILK
      protocol: CA
      states:
        OK: 0
        TRIPPED: 1
    RPOWER:
      control_type: state
      description: Gets the state of a power supply
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:RPOWER
      protocol: CA
      states:
        'OFF': 0
        'ON': 1
    SETI:
      control_type: scalar
      description: Sets the target current for a magnet power supply.
      dtype: float
      identifier: CLA-VBC-MAG-DIP-02:SETI
      protocol: CA
      read_only: false
      units: A
    SETK:
      control_type: scalar
      description: Sets the target angle for a magnet. This ultimately sets a current
        for the power supply
      dtype: float
      identifier: CLA-VBC-MAG-DIP-02:SETK
      protocol: CA
      read_only: false
      units: K
    SPOWER:
      control_type: state
      description: Sets the state of a power supply
      dtype: int
      identifier: CLA-VBC-MAG-DIP-02:SPOWER
      protocol: CA
      read_only: false
      states:
        'OFF': 0
        'ON': 1
