LINAC_RF_PID:
  name: LINAC_RF_PID
  hardware_class: Feedback
  hardware_type: PID
  hardware_model: RF
  machine_area: DEMO
  inputs: [setpoint, phase]
  outputs: [phase]
  upstream: [LINAC_RF_CAVITY]
  downstream: [LINAC_KLYSTRON_MODULATOR, LINAC_RF_CAVITY]

LINAC_RF_CAVITY:
  name: LINAC_RF_CAVITY
  hardware_class: RFCavity
  hardware_type: RFCavity
  hardware_model: SBand
  machine_area: DEMO
  inputs: [power, phase]
  outputs: [voltage]
  upstream: [LINAC_KLYSTRON_MODULATOR, LINAC_RF_PID, INJ_BAM_01]
  downstream: []
  physical:
    datum: {x: 0.0, y: 0.0, z: 6.10}
    middle: {x: 0.0, y: 0.0, z: 6.30}
    length: 0.40

