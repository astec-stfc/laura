# Injector beamline — global Cartesian coordinates.
#
# Every physical element specifies its position as an absolute {x, y, z}
# vector (metres) in the global coordinate system.  This is the most
# explicit form: positions are independent of element order in the file.
#
# Beamline layout (all on-axis, z-axis only):
#
#   0.00        0.20        0.60   0.82        1.12        1.42  1.65
#   |<--GUN (0.20m)-->|      |<-SOL->|<-Q1->|  |<-Q2->|  |<-Q3->||<BPM>|
#                                              (0.12m)   (0.12m)
#
# s values (at element middles):
#   GUN_CAVITY  s=0.10 m
#   INJ_SOL_01  s=0.45 m
#   INJ_QUAD_01 s=0.76 m
#   INJ_QUAD_02 s=1.06 m
#   INJ_QUAD_03 s=1.36 m
#   INJ_BPM_01  s=1.60 m

GUN_CAVITY:
  name: GUN_CAVITY
  hardware_class: RF
  hardware_type: RFCavity
  hardware_model: SBand
  machine_area: INJ
  physical:
    middle: {x: 0.0, y: 0.0, z: 0.10}
    length: 0.20

INJ_SOL_01:
  name: INJ_SOL_01
  hardware_class: Magnet
  hardware_type: Solenoid
  hardware_model: Generic
  machine_area: INJ
  physical:
    middle: {x: 0.0, y: 0.0, z: 0.45}
    length: 0.30

INJ_QUAD_01:
  name: INJ_QUAD_01
  hardware_class: Magnet
  hardware_type: Quadrupole
  hardware_model: Generic
  machine_area: INJ
  magnetic:
    length: 0.12
    k1l: 1.0
  physical:
    middle: {x: 0.0, y: 0.0, z: 0.76}
    length: 0.12

INJ_QUAD_02:
  name: INJ_QUAD_02
  hardware_class: Magnet
  hardware_type: Quadrupole
  hardware_model: Generic
  machine_area: INJ
  magnetic:
    length: 0.12
    k1l: -1.0
  physical:
    middle: {x: 0.0, y: 0.0, z: 1.06}
    length: 0.12

INJ_QUAD_03:
  name: INJ_QUAD_03
  hardware_class: Magnet
  hardware_type: Quadrupole
  hardware_model: Generic
  machine_area: INJ
  magnetic:
    length: 0.12
    k1l: 1.0
  physical:
    middle: {x: 0.0, y: 0.0, z: 1.36}
    length: 0.12

INJ_BPM_01:
  name: INJ_BPM_01
  hardware_class: Diagnostic
  hardware_type: Beam_Position_Monitor
  hardware_model: Stripline
  machine_area: INJ
  physical:
    middle: {x: 0.0, y: 0.0, z: 1.60}
    length: 0.10
