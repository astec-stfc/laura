# Injector beamline — s-coordinate (arc-length) positions.
#
# Every physical element specifies its position using a single ``s`` value
# (arc-length in metres from the global origin along the design trajectory).
# LAURA integrates the design orbit element-by-element during lattice
# assembly and converts each s value to global {x, y, z} automatically.
#
# Rules for this file:
#   • All positioned elements MUST use the same coordinate system.
#     Mixing ``s`` and ``middle`` in the same section is not allowed.
#   • ``s_point`` (default "middle") states which point of the element the
#     s value refers to.  Omit it to use the default.
#   • ``reference_placement`` elements may always appear alongside s elements.
#
# The positions defined here are identical to those in
# positioning_global_elements.yaml — compare to confirm the conversion.

GUN_CAVITY:
  name: GUN_CAVITY
  hardware_type: RFCavity
  machine_area: INJ
  physical:
    s: 0.10          # middle of cavity at 0.10 m from the origin
    length: 0.20

INJ_SOL_01:
  name: INJ_SOL_01
  hardware_type: Solenoid
  machine_area: INJ
  physical:
    s: 0.45          # middle at 0.45 m
    length: 0.30

INJ_QUAD_01:
  name: INJ_QUAD_01
  hardware_type: Quadrupole
  machine_area: INJ
  magnetic:
    length: 0.12
    k1l: 1.0
  physical:
    s: 0.76          # middle at 0.76 m
    length: 0.12

INJ_QUAD_02:
  name: INJ_QUAD_02
  hardware_type: Quadrupole
  machine_area: INJ
  magnetic:
    length: 0.12
    k1l: -1.0
  physical:
    s: 1.06
    length: 0.12

INJ_QUAD_03:
  name: INJ_QUAD_03
  hardware_type: Quadrupole
  machine_area: INJ
  magnetic:
    length: 0.12
    k1l: 1.0
  physical:
    s: 1.36
    length: 0.12

INJ_BPM_01:
  name: INJ_BPM_01
  hardware_type: Beam_Position_Monitor
  machine_area: INJ
  physical:
    s: 1.60          # middle at 1.60 m  (s_point defaults to "middle")
    # s_point: middle  # explicit form of the default
    length: 0.10

# --- s_point examples ---
#
# Specify where along the element the s value is measured.
# The default is "middle" but you can use "start" or "end":
#
#   # s marks the entrance face:
#   physical:
#     s: 1.55
#     s_point: start
#     length: 0.10
#
#   # s marks the exit face:
#   physical:
#     s: 1.65
#     s_point: end
#     length: 0.10
#
# All three produce the same resolved middle position (z = 1.60 m).
