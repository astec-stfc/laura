# One beam path that enters the same linac twice.
#
# ``multipass: N`` says this entry is the Nth traversal of hardware an earlier
# entry has already been through. It is an opt-in, and it is required, because
# a section listed twice is otherwise read as something else entirely:
#
#   repetition   N identical devices at N positions.   The default.
#   multipass    one device at one position, entered N times.
#
# Both are written by listing a section twice, and LAURA cannot tell them
# apart from the shape alone, so it does not guess. Without ``multipass:``,
#
#   ERL:
#     - INJECTOR
#     - LINAC
#     - ARC
#     - LINAC
#     - DUMP
#
# is a machine with *two linacs* -- LINAC.1 and LINAC.2, each with its own
# deep-copied cavities at its own positions, which is exactly what a section
# order does with ``MAIN: [CELL, CELL]`` one level down. Perfectly valid, and
# not an ERL. Setting LINAC.1's gradient would not touch LINAC.2's, because
# they are two machines' worth of hardware.
#
# With ``multipass:``, both entries name the same section and the same cavity
# objects, and the numbering is checked: every occurrence must carry it (it is
# a claim about the hardware, so it holds for all of them or none), and the
# numbers must be exactly 1..N in beam order.
#
# ------------------------------------------------------------------------
# Addressing a pass
# ------------------------------------------------------------------------
# Once a name is on the path twice, every name -> position lookup is
# ambiguous. On a multipass path, and only there, the ambiguous names take
# PALS's ``NAME#N`` selector:
#
#     layout.arc_lengths()      # {'INJ_Q': 0.0, ..., 'CAV_01#1': 1.2,
#                               #  ..., 'CAV_01#2': 7.1, ..., 'DMP_Q': 11.3}
#
#     layout.elements_between(start="CAV_01#2", end="DMP_Q")
#         -> ['CAV_01#2', 'DRIFT_LIN.2#2', 'LIN_Q#2', 'DRIFT_LIN.3#2',
#             'CAV_02#2', 'DRIFT_LIN.4#2', 'DRIFT_DUMP', 'DMP_Q']
#
# ``DRIFT_LIN.2#2`` shows the two numbering schemes side by side, and they are
# orthogonal. ``.2`` is *repetition within a section*: LINAC lists DRIFT_LIN
# four times, so the section holds four separate drifts (.1 to .4), exactly as
# any section order does with a repeated name. ``#2`` is *multipass*: the
# second traversal of all of them. Four drifts, two passes each.
#
# (``elements_between``'s first positional parameter is ``end``, not ``start``
# -- pass them by keyword.) Asking for a bare ``CAV_01`` raises rather than
# quietly taking the first pass, and the message names both addresses.
#
# A name entered once stays bare, so nothing that is not ambiguous is
# qualified. ``get_element("CAV_01#1")`` and ``get_element("CAV_01#2")`` both
# return the same object -- one cavity -- which is the whole point.
#
# ------------------------------------------------------------------------
# What differs between the passes
# ------------------------------------------------------------------------
# If nothing differed there would be no reason to track the passes
# separately -- you would want a turn count instead, which is a *tracking*
# setting (elegant ``n_passes``, Xsuite ``num_turns``) and never appears in a
# lattice. A storage ring's turns are strict repeats and need none of this.
#
# What differs in an ERL is the RF phase: the return bunch arrives half an RF
# period late and decelerates, giving its energy back to the field. One cavity
# cannot store two phases, so the second pass's value lives on the pass:
#
#     overrides: {ELEMENT_NAME: {attribute.path: value}}
#
# The element name is required. ``cavity`` is a sub-model *on* an element, so
# ``cavity.phase`` on its own names a path but no element, and this linac has
# two cavities.
#
# Overrides are checked at load: an element the section does not contain, or
# an attribute path that does not resolve on it, is refused rather than
# silently doing nothing. They are also refused on any entry not marked
# ``multipass``, because every other traversal has an element of its own to
# write the value on -- a single pass has the element itself, and repetition
# has its own deep copy.
#
# Note the return pass is NOT ``direction: -1``. The bunch comes back round
# the arc and through the linac the same way it went in; what makes it
# decelerate is the phase, not the direction of travel.

default_layout: ERL

layouts:
  ERL:
    - INJECTOR

    # Pass 1: accelerating, on crest.
    - LINAC:
        multipass: 1

    # Recirculation: entered once, so nothing here is multipass.
    - ARC

    # Pass 2: the same two cavities, half an RF period later.
    - LINAC:
        multipass: 2
        overrides:
          CAV_01: {cavity.phase: 180.0}
          CAV_02: {cavity.phase: 180.0}

    - DUMP
