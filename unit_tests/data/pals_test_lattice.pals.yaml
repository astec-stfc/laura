# Fixture for unit_tests/test_pals_importer.py: one element of each kind the
# LAURA PALS importer converts, with values chosen so every conversion is
# checkable by hand.
#
# The BeginningEle fixes the reference species and energy, which the importer
# needs to normalise the fields given as `Bn1` rather than `Kn1`.
PALS:
  version: 1
  extension_labels:
    names:
      BmadP: Bmad element data with no PALS equivalent
  facility:
    - main_line:
        kind: BeamLine
        line:
          - begin:
              kind: BeginningEle
              ReferenceP:
                species_ref: "electron"
                E_tot_ref: 1.0e9
          - d1:
              kind: Drift
              length: 1.0
          - q1:
              kind: Quadrupole
              length: 0.5
              MagneticMultipoleP:
                Kn1: 0.8
          - q2:
              kind: Quadrupole
              length: 0.5
              MagneticMultipoleP:
                Bn1: 1.2
          - s1:
              kind: Sextupole
              length: 0.3
              MagneticMultipoleP:
                Kn2L: 1.5
          - o1:
              kind: Octupole
              length: 0.2
              MagneticMultipoleP:
                Kn3L: 3.0
                Ks3L: 0.5
          - b1:
              kind: Bend
              length: 1.5
              BendP:
                angle_ref: 0.15
                e1: 0.05
                e2: 0.03
                edge1_int: 0.02
                edge2_int: 0.04
                tilt_ref: 0.1
          - sol1:
              kind: Solenoid
              length: 0.4
              SolenoidP:
                Ksol: 0.6
          - cav1:
              kind: RFCavity
              length: 1.0
              RFP:
                frequency: 1.3e9
                voltage: 2.0e7
                phase: 0.25
                num_cells: 9
                cavity_type: STANDING_WAVE
          - kick1:
              kind: Kicker
              length: 0.2
              MagneticMultipoleP:
                Kn0L: 0.001
              BmadP:
                Bmad_key: HKicker
          - kick2:
              kind: Kicker
              length: 0.2
              MagneticMultipoleP:
                Ks0L: 0.002
              BmadP:
                Bmad_key: VKicker
          - kick3:
              kind: Kicker
              length: 0.2
              MagneticMultipoleP:
                Kn0L: 0.003
                Ks0L: 0.004
          - mon1:
              kind: Instrument
              BmadP:
                Bmad_key: Monitor
          - inst1:
              kind: Instrument
          - col1:
              kind: Mask
              length: 0.1
              ApertureP:
                x_min: -0.01
                x_max: 0.01
                y_min: -0.02
                y_max: 0.02
                shape: RECTANGULAR
                location: EVERYWHERE
          - off1:
              kind: Quadrupole
              length: 0.25
              MagneticMultipoleP:
                Kn1: 1.0
              BodyShiftP:
                x_offset: 0.001
                y_rot: 0.002
                z_rot: 0.003
          - d2:
              kind: Drift
              length: 0.5
          - mark1:
              kind: Marker
    - lat1:
        kind: Lattice
        branches:
          - main_line
    - use: "lat1"
